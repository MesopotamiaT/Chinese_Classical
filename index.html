<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HSK Trainer">

    <meta name="theme-color" content="#f4f7fb">

    <title>HSK Trainer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,500;1,8..60,600&display=swap"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <style>

        /* =========================================================
           HSK TRAINER — PROFESSIONAL UI
           ========================================================= */

        :root {

            /* BASE */
            --bg: #f3f6fa;
            --card: #ffffff;
            --surface: #f8fafc;
            --surface-2: #f1f5f9;

            --text-main: #15171c;
            --text-muted: #667085;
            --text-soft: #98a2b3;

            --border: #e7eaf0;
            --border-strong: #d8dde6;

            /* BRAND */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eaf1ff;

            --focus-color: #7c3aed;
            --focus-soft: #f2eafe;

            /* BOX COLORS */
            --box1: #e5484d;
            --box2: #e99a14;
            --box3: #3b82f6;
            --box4: #8b5cf6;
            --box5: #27a65a;
            --box6: #df3f7d;

            /* SHADOW */
            --shadow-small:
                0 1px 2px rgba(16, 24, 40, 0.04),
                0 3px 8px rgba(16, 24, 40, 0.05);

            --shadow-medium:
                0 8px 24px rgba(16, 24, 40, 0.08),
                0 2px 8px rgba(16, 24, 40, 0.04);

            --shadow-card:
                0 20px 48px rgba(16, 24, 40, 0.09),
                0 4px 16px rgba(16, 24, 40, 0.05);

            /* DIMENSIONS */
            --radius-small: 10px;
            --radius-button: 13px;
            --radius-card: 24px;

            /* FONT */
            --font-ui:
                'Manrope',
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            --font-read:
                'Source Serif 4',
                Georgia,
                'Songti SC',
                serif;
        }


        /* =========================================================
           DARK MODE
           ========================================================= */

        @media (prefers-color-scheme: dark) {

            :root {

                --bg: #0d0f14;
                --card: #16191f;
                --surface: #1c2027;
                --surface-2: #222731;

                --text-main: #f2f4f7;
                --text-muted: #a7b0bf;
                --text-soft: #778292;

                --border: #292e38;
                --border-strong: #363d49;

                --primary: #6da4ff;
                --primary-dark: #4e8ef7;
                --primary-soft: #192b4b;

                --focus-color: #ae8aff;
                --focus-soft: #291f3c;

                --box1: #f06166;
                --box2: #f0aa34;
                --box3: #64a2ff;
                --box4: #a68bfa;
                --box5: #46bd74;
                --box6: #ee6a9c;

                --shadow-small:
                    0 2px 7px rgba(0,0,0,0.22);

                --shadow-medium:
                    0 10px 28px rgba(0,0,0,0.30);

                --shadow-card:
                    0 22px 50px rgba(0,0,0,0.38),
                    0 4px 14px rgba(0,0,0,0.22);
            }
        }


        /* =========================================================
           RESET
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            font-family: var(--font-ui);

            background: var(--bg);
            color: var(--text-main);

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }


        body {

            background:
                radial-gradient(
                    circle at 10% -10%,
                    rgba(37, 99, 235, 0.10),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 110% 15%,
                    rgba(124, 58, 237, 0.07),
                    transparent 30%
                ),
                var(--bg);
        }


        button,
        input,
        select {

            font-family: inherit;
        }


        button {

            border: 0;
            outline: 0;

            cursor: pointer;

            font-weight: 800;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                filter 0.12s ease,
                background-color 0.12s ease;

            -webkit-tap-highlight-color: transparent;
        }


        button:active {

            transform: scale(0.975);
        }


        button:disabled {

            opacity: 0.38;
            cursor: not-allowed;

            transform: none !important;
        }


        .hidden {

            display: none !important;
        }


        /* =========================================================
           APP CONTAINER
           ========================================================= */

        .container {

            width: 100%;
            max-width: 560px;

            height: 100vh;
            height: 100dvh;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));

            overflow: hidden;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        .header {

            flex-shrink: 0;

            display: flex;
            flex-direction: column;

            gap: 8px;

            margin-bottom: 10px;
        }


        .header-top {

            display: flex;
            flex-direction: column;

            gap: 10px;

            width: 100%;
        }


        .header-top h2 {

            margin: 0 2px;

            font-size: 1.35rem;
            line-height: 1.1;

            font-weight: 800;

            letter-spacing: -0.045em;
        }


        /* =========================================================
           SYSTEM BUTTONS
           ========================================================= */

        .system-buttons {

            display: grid;
            grid-template-columns: repeat(5, 1fr);

            gap: 6px;

            width: 100%;
        }


        .system-buttons button {

            min-width: 0;
            min-height: 42px;

            padding: 7px 3px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--card);
            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.61rem;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        .system-buttons .btn-action {

            background:
                linear-gradient(
                    145deg,
                    var(--primary),
                    var(--primary-dark)
                );

            border-color: transparent;

            color: #ffffff;

            box-shadow:
                0 7px 16px rgba(37, 99, 235, 0.20);
        }


        .system-buttons .btn-stats {

            color: var(--box6);
        }


        .system-buttons .btn-danger {

            color: var(--box1);
        }


        /* =========================================================
           MODE BUTTONS
           ========================================================= */

        .filter-buttons {

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 6px;

            width: 100%;
        }


        .filter-buttons button {

            min-width: 0;
            min-height: 43px;

            padding: 8px 5px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--card);
            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.69rem;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================================
           BOX 6 DAILY
           ========================================================= */

        #box6-daily-progress {

            position: relative;

            min-height: 40px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 9px 14px 9px 42px;

            border: 1px solid var(--border);

            border-radius: var(--radius-button);

            background: var(--card);

            color: var(--box6);

            box-shadow: var(--shadow-small);

            font-size: 0.69rem;

            font-weight: 800;

            letter-spacing: 0.05em;
        }


        #box6-daily-progress::before {

            content: "6";

            position: absolute;

            left: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: 22px;
            height: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--box6);

            color: white;

            font-size: 0.65rem;
            font-weight: 800;

            box-shadow:
                0 4px 10px rgba(223, 63, 125, 0.24);
        }


        /* =========================================================
           BOX NAVIGATION
           ========================================================= */

        .stats {

            flex-shrink: 0;

            display: grid;
            grid-template-columns: repeat(6, 1fr);

            gap: 6px;

            padding: 7px;

            margin-bottom: 10px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--card);

            box-shadow: var(--shadow-small);
        }


        .stat-box {

            position: relative;

            min-width: 0;
            min-height: 48px;

            padding: 7px 1px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border: 1px solid transparent;
            border-radius: 10px;

            background: transparent;

            color: var(--text-muted);

            font-size: 0.61rem;
            font-weight: 700;

            line-height: 1.2;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease,
                background 0.12s ease,
                border-color 0.12s ease;
        }


        .stat-box span {

            margin-top: 2px;

            font-size: 0.82rem;
            font-weight: 800;
        }


        #stat-box-1 { color: var(--box1); }
        #stat-box-2 { color: var(--box2); }
        #stat-box-3 { color: var(--box3); }
        #stat-box-4 { color: var(--box4); }
        #stat-box-5 { color: var(--box5); }
        #stat-box-6 { color: var(--box6); }


        .stat-box.active-box {

            border-color: var(--border);

            background: var(--surface);
        }


        .stat-box.selected-box {

            border-color: currentColor;

            background: var(--surface);

            transform: translateY(-1px);

            box-shadow: var(--shadow-small);
        }


        .stat-box.inactive-box {

            opacity: 0.32;
        }


        .daily-badge {

            position: absolute;

            top: -5px;
            right: -4px;

            min-width: 17px;
            height: 17px;

            padding: 0 4px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 2px solid var(--card);

            border-radius: 999px;

            background: var(--focus-color);

            color: white;

            font-size: 0.51rem;
            font-weight: 800;

            box-shadow:
                0 3px 7px rgba(16,24,40,0.18);

            pointer-events: none;
        }


        /* =========================================================
           MAIN CARD
           ========================================================= */

        .card {

            position: relative;

            min-height: 0;

            flex-grow: 1;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            padding: 17px 18px 15px;

            border: 1px solid var(--border);
            border-radius: var(--radius-card);

            background: var(--card);

            box-shadow: var(--shadow-card);
        }


        .card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 8%;
            right: 8%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.65),
                    transparent
                );

            pointer-events: none;
        }


        .card-content {

            position: relative;
            z-index: 1;

            min-height: 0;

            flex-grow: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 11px;

            text-align: center;
        }


        /* =========================================================
           CARD LABEL
           ========================================================= */

        #v-box {

            max-width: 100%;

            padding: 6px 12px;

            border: 1px solid var(--border);

            border-radius: 999px;

            background: var(--surface);

            color: var(--text-muted);

            font-size: 0.64rem;

            font-weight: 800;

            letter-spacing: 0.07em;

            text-transform: uppercase;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }


        /* =========================================================
           GERMAN WORD
           ========================================================= */

        #v-de {

            width: min(100%, 430px);

            margin: 0;

            font-family: var(--font-read);

            font-size:
                clamp(
                    1.25rem,
                    4.5vw,
                    1.62rem
                );

            font-weight: 600;

            line-height: 1.3;

            letter-spacing: -0.012em;

            color: var(--text-main);

            word-break: break-word;
        }


        .char-tag {

            display: block;

            width: fit-content;

            margin: 7px auto 0;

            padding: 4px 9px;

            border-radius: 999px;

            background: var(--primary-soft);

            color: var(--primary);

            font-family: var(--font-ui);

            font-size: 0.70rem;

            font-weight: 700;
        }


        /* =========================================================
           CHINESE
           ========================================================= */

        #v-hz {

            margin: 0;

            font-size:
                clamp(
                    3.7rem,
                    16vw,
                    5.4rem
                );

            font-weight: 400;

            line-height: 1;

            letter-spacing: -0.045em;

            color: var(--text-main);
        }


        #v-hz.long-char {

            font-size:
                clamp(
                    2.45rem,
                    10vw,
                    3.55rem
                );

            letter-spacing: -0.035em;
        }


        #v-py {

            margin: 0;

            font-family: var(--font-read);

            font-size:
                clamp(
                    1.05rem,
                    4vw,
                    1.3rem
                );

            font-style: italic;

            font-weight: 600;

            color: var(--primary);
        }


        /* =========================================================
           CARD STATS
           ========================================================= */

        #v-stats {

            max-width: 100%;

            margin-top: 1px;

            padding: 7px 12px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--surface);

            color: var(--text-muted);

            font-size: 0.75rem;

            line-height: 1.45;
        }


        /* =========================================================
           HANZI WRITER
           ========================================================= */

        .writer-grid {

            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 0;
        }


        .char-box {

            position: relative;

            width: min(100%, 390px);

            max-width: 390px;
            max-height: 390px;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border: 1px solid var(--border-strong);

            border-radius: 21px;

            background-color: var(--surface);

            background-image:

                linear-gradient(
                    to right,
                    transparent 49.75%,
                    var(--border) 49.75%,
                    var(--border) 50.25%,
                    transparent 50.25%
                ),

                linear-gradient(
                    to bottom,
                    transparent 49.75%,
                    var(--border) 49.75%,
                    var(--border) 50.25%,
                    transparent 50.25%
                );

            box-shadow:
                inset 0 1px 4px rgba(16,24,40,0.03);

            touch-action: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }


        .char-box:active {

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }


        /* =========================================================
           ACTION AREA
           ========================================================= */

        .action-area {

            position: relative;
            z-index: 1;

            flex-shrink: 0;

            margin-top: auto;

            padding-top: 13px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }


        .row-2 {

            width: 100%;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 8px;
        }


        .row-3 {

            width: 100%;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 8px;
        }


        /* =========================================================
           BUTTONS
           ========================================================= */

        .btn-large {

            min-height: 50px;

            padding: 13px 12px;

            border-radius: var(--radius-button);

            font-size: 0.88rem;

            letter-spacing: 0.035em;

            text-transform: uppercase;
        }


        .btn-medium {

            min-height: 45px;

            padding: 11px 8px;

            border-radius: var(--radius-button);

            font-size: 0.82rem;
        }


        .btn-primary {

            background:
                linear-gradient(
                    145deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: white;

            box-shadow:
                0 7px 16px rgba(37, 99, 235, 0.20);
        }


        .btn-secondary {

            border: 1px solid var(--border);

            background: var(--surface);

            color: var(--text-main);

            box-shadow: var(--shadow-small);
        }


        .btn-tool {

            min-height: 46px;

            padding: 10px 4px;

            border: 1px solid var(--border);

            border-radius: var(--radius-button);

            background: var(--surface);

            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.75rem;

            letter-spacing: 0.04em;

            text-transform: uppercase;
        }


        .btn-grade {

            min-height: 51px;

            padding: 12px 3px;

            border-radius: var(--radius-button);

            color: white;

            font-size: 0.78rem;

            font-weight: 800;

            letter-spacing: 0.035em;

            text-transform: uppercase;

            box-shadow:
                0 7px 15px rgba(16,24,40,0.11);
        }


        /* =========================================================
           DICTIONARY
           ========================================================= */

        #dict-view {

            position: relative;
            z-index: 1;

            min-height: 0;
        }


        #dict-search-input {

            width: 100%;

            min-height: 47px;

            padding: 11px 13px;

            outline: none;

            border: 1px solid var(--border-strong);

            border-radius: var(--radius-button);

            background: var(--surface);

            color: var(--text-main);

            font-size: 0.93rem;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }


        #dict-search-input::placeholder {

            color: var(--text-soft);
        }


        #dict-search-input:focus {

            border-color: var(--primary);

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }


        #dict-results {

            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }


        /* =========================================================
           MODAL
           ========================================================= */

        .modal-overlay {

            position: fixed;

            inset: 0;

            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(18px, env(safe-area-inset-top))
                18px
                max(18px, env(safe-area-inset-bottom));

            background:
                rgba(5, 8, 13, 0.63);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }


        .modal-content {

            width: 100%;
            max-width: 420px;

            max-height: 82vh;

            padding: 21px;

            display: flex;
            flex-direction: column;

            border: 1px solid var(--border);

            border-radius: 23px;

            background: var(--card);

            box-shadow:
                0 28px 70px rgba(0,0,0,0.30);
        }


        /* =========================================================
           BOX 6 STATISTICS
           ========================================================= */

        #box6-stats-table {

            width: 100%;

            border-collapse: collapse;

            font-size: 0.78rem;
        }


        #box6-stats-table th {

            position: sticky;

            top: 0;

            z-index: 1;

            padding: 9px 6px;

            border-bottom:
                1px solid var(--border-strong);

            background: var(--card);

            color: var(--text-muted);

            font-size: 0.60rem;

            text-transform: uppercase;

            letter-spacing: 0.025em;

            text-align: left;

            cursor: pointer;

            user-select: none;

            white-space: nowrap;
        }


        #box6-stats-table th:nth-child(n+2) {

            text-align: center;
        }


        #box6-stats-table td {

            padding: 9px 6px;

            border-bottom:
                1px solid var(--border);

            vertical-align: middle;
        }


        #box6-stats-table td:nth-child(n+2) {

            text-align: center;
        }


        #box6-stats-table th.sorted-asc::after {

            content: " ▲";

            color: var(--primary);
        }


        #box6-stats-table th.sorted-desc::after {

            content: " ▼";

            color: var(--primary);
        }


        #box6-stats-summary {

            margin-bottom: 10px;

            padding: 7px 10px;

            border-radius: 10px;

            background: var(--surface);

            color: var(--text-muted);

            font-size: 0.72rem;

            text-align: center;
        }


        /* =========================================================
           FOCUS
           ========================================================= */

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {

            outline: none;

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }


        /* =========================================================
           SCROLLBAR
           ========================================================= */

        * {

            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }


        *::-webkit-scrollbar {

            width: 6px;
            height: 6px;
        }


        *::-webkit-scrollbar-track {

            background: transparent;
        }


        *::-webkit-scrollbar-thumb {

            border-radius: 999px;

            background: var(--border-strong);
        }


        /* =========================================================
           SMALL SCREENS
           ========================================================= */

        @media (max-width: 390px) {

            .container {

                padding-left: 9px;
                padding-right: 9px;
            }


            .header {

                gap: 6px;

                margin-bottom: 8px;
            }


            .header-top {

                gap: 7px;
            }


            .header-top h2 {

                font-size: 1.17rem;
            }


            .system-buttons,
            .filter-buttons,
            .stats,
            .row-2,
            .row-3 {

                gap: 5px;
            }


            .system-buttons button {

                min-height: 38px;

                padding: 5px 2px;

                font-size: 0.54rem;
            }


            .filter-buttons button {

                min-height: 39px;

                font-size: 0.62rem;
            }


            #box6-daily-progress {

                min-height: 36px;

                padding-top: 7px;
                padding-bottom: 7px;
            }


            .stats {

                padding: 5px;

                margin-bottom: 8px;
            }


            .stat-box {

                min-height: 43px;

                font-size: 0.55rem;
            }

    </style>
</head>

>


    <div

    >


        <h3
            style="
                margin-top:0;
                color:var(--text-main);
                font-size:1rem;
                border-bottom:1px solid var(--border);
                padding-bottom:12px;
                margin-bottom:12px;
                font-weight:800;
                text-transform:uppercase;
                letter-spacing:0.04em;
            "
        >
            Box 6 Statistik
        </h3>


        <div id="box6-stats-summary"></div>


        <div
            style="
                overflow:auto;
                flex-grow:1;
                margin-bottom:16px;

            "

            <table id="box6-stats-table">

                    <tr>

                            Richtig
                        </th>

                        <th onclick="sortBox6Stats('wrong')">
                            Falsch
                        </th>

                        <th onclick="sortBox6Stats('rate')">
                            Quote
                        </th>

                        <th onclick="sortBox6Stats('dueDays')">

                        </th>

                    </tr>

<script>


/* ============================================================
   STATE
   ============================================================ */


let state =
    JSON.parse(
        localStorage.getItem('hsk_data')
    ) || {
        box1: [],
        box2: [],
        box3: [],
        box4: [],
        box5: [],
        box6: []
    };


if (!state.box6) {

    state.box6 = [];
}


if (!state.box6Daily) {

    state.box6Daily = {
        date: new Date().toDateString(),
        count: 0
    };
}


let sessionQueue = [];

let currentCard = null;

let currentBoxName = "";


let currentQuizChars = [];

let currentQuizCharIndex = 0;

let currentWriter = null;

let singleCharBox = null;


let onlyFocusMode = false;

let randomMode = false;

let selectedBoxFilter = null;

let dictMode = false;

let currentDictResults = [];


let box6SortColumn = 'queries';

let box6SortDirection = 'desc';



/* ============================================================
   BOX UI
   ============================================================ */


document.getElementById('stats').innerHTML =
    [1,2,3,4,5,6]
        .map(i =>

            `
            <div
                id="stat-box-${i}"
                class="stat-box"
            >

                BOX ${i}

                <br>

                <span id="stat-count-${i}">
                    0
                </span>

                ${
                    (i >= 2 && i <= 5)

                    ?

                    `
                    <div
                        id="daily-count-${i}"
                        class="daily-badge"
                    >
                        0
                    </div>
                    `

                    :

                    ''
                }

            </div>
            `
        )
        .join('');



[1,2,3,4,5,6].forEach(i => {


    document
        .getElementById(`stat-box-${i}`)
        .addEventListener(
            'click',
            () => {


                if (dictMode) {

                    toggleDictMode();
                }


                sessionQueue = [];


                if (selectedBoxFilter === i) {

                    selectedBoxFilter = null;

                } else {

                    selectedBoxFilter = i;


                    if (randomMode) {

                        toggleRandomMode();
                    }


                    if (onlyFocusMode) {

                        toggleOnlyFocusMode();
                    }
                }


                updateUI();

                next();
            }
        );

});



/* ============================================================
   HELPERS
   ============================================================ */


function countHanzi(str) {


    if (!str) {

        return 0;
    }


    let count = 0;


    for (let i = 0; i < str.length; i++) {


        let code =
            str.charCodeAt(i);


        if (

            (code >= 0x4E00 && code <= 0x9FFF)

            ||

            (code >= 0x3400 && code <= 0x4DBF)

        ) {

            count++;
        }
    }


    return count;
}



function daysBetween(
    dateStr1,
    dateStr2
) {


    let d1 =
        new Date(dateStr1);


    let d2 =
        new Date(dateStr2);


    return Math.round(

        (d2 - d1)

        /

        (
            1000 *
            60 *
            60 *
            24
        )
    );
}



function addDays(
    dateStr,
    days
) {


    let d =
        dateStr

        ?

        new Date(dateStr)

        :

        new Date();


    d.setDate(
        d.getDate() + days
    );


    return d.toDateString();
}



function isBox6CardDue(c) {


    if (!c.nextReviewDate) {

        return true;
    }


    let today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    let due =
        new Date(
            c.nextReviewDate
        );


    due.setHours(
        0,
        0,
        0,
        0
    );


    return due <= today;
}



function box6DueInDays(c) {


    if (!c.nextReviewDate) {

        return -9999;
    }


    let today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    let due =
        new Date(
            c.nextReviewDate
        );


    due.setHours(
        0,
        0,
        0,
        0
    );


    return Math.round(

        (due - today)

        /

        (
            1000 *
            60 *
            60 *
            24
        )
    );
}



/* ============================================================
   BOX 6 DAILY
   ============================================================ */


function checkBox6DailyReset() {


    let today =
        new Date()
            .toDateString();


    if (

        !state.box6Daily

        ||

        state.box6Daily.date !== today

    ) {


        state.box6Daily = {

            date: today,

            count: 0
        };
    }
}



function updateBox6DailyDisplay() {


    checkBox6DailyReset();


    let el =
        document.getElementById(
            'box6-daily-progress'
        );


    if (el) {

        el.innerText =
            `BOX 6 HEUTE: ${state.box6Daily.count}/100`;
    }
}



/* ============================================================
   BOX 6 STATISTICS
   ============================================================ */


function openBox6Stats() {


    document
        .getElementById(
            'box6StatsModal'
        )
        .classList
        .remove('hidden');


    renderBox6StatsTable();
}



function closeBox6Stats() {


    document
        .getElementById(
            'box6StatsModal'
        )
        .classList
        .add('hidden');
}



function sortBox6Stats(column) {


    if (
        box6SortColumn === column
    ) {


        box6SortDirection =
            box6SortDirection === 'asc'

            ?

            'desc'

            :

            'asc';


    } else {


        box6SortColumn =
            column;


        box6SortDirection =
            column === 'hz'

            ?

            'asc'

            :

            'desc';
    }


    renderBox6StatsTable();
}



function renderBox6StatsTable() {


    let data =
        state.box6.map(c => {


            let stats =
                c.stats || {
                    queries: 0,
                    correct: 0
                };


            let queries =
                stats.queries || 0;


            let correct =
                stats.correct || 0;


            let wrong =
                queries - correct;


            let rate =
                queries > 0

                ?

                (correct / queries) * 100

                :

                0;


            let dueDays =
                box6DueInDays(c);


            return {

                card: c,

                hz: c.hz || '',

                py: c.py || '',

                de: c.de || '',

                queries,

                correct,

                wrong,

                rate,

                dueDays
            };
        });



    data.sort(
        (a, b) => {


            let valA =
                a[box6SortColumn];


            let valB =
                b[box6SortColumn];


            let cmp;


            if (
                typeof valA === 'string'
            ) {


                cmp =
                    valA.localeCompare(
                        valB,
                        'zh'
                    );


            } else {


                cmp =
                    valA - valB;
            }


            return (
                box6SortDirection === 'asc'
            )

                ?

                cmp

                :

                -cmp;
        }
    );



    let summaryEl =
        document.getElementById(
            'box6-stats-summary'
        );


    summaryEl.innerText =

        `${data.length} Vokabel${
            data.length === 1

            ?

            ''

            :

            'n'
        } in Box 6`;



    let tbody =
        document.getElementById(
            'box6-stats-body'
        );



    if (
        data.length === 0
    ) {


        tbody.innerHTML =

            `
            <tr>

                <td
                    colspan="6"
                    style="
                        text-align:center;
                        padding:20px;
                        color:var(--text-muted);
                    "
                >
                    Keine Vokabeln in Box 6
                </td>

            </tr>
            `;


    } else {


        tbody.innerHTML =

            data
            .map(d => {


                let dueLabel;


                if (
                    d.dueDays <= 0
                ) {


                    dueLabel =

                        `
                        <span
                            style="
                                color:var(--box6);
                                font-weight:700;
                            "
                        >
                            jetzt
                        </span>
                        `;


                } else if (
                    d.dueDays === 1
                ) {


                    dueLabel =
                        `in 1 Tag`;


                } else {


                    dueLabel =
                        `in ${d.dueDays} Tg.`;
                }


                return `

                    <tr>

                        <td>

                            <div
                                style="
                                    font-weight:700;
                                    font-size:1rem;
                                "
                            >
                                ${d.hz}
                            </div>

                            <div
                                style="
                                    color:var(--primary);
                                    font-size:0.75rem;
                                    font-weight:600;
                                "
                            >
                                ${d.py}
                            </div>

                        </td>

                        <td>
                            ${d.queries}
                        </td>

                        <td
                            style="
                                color:var(--box5);
                                font-weight:700;
                            "
                        >
                            ${d.correct}
                        </td>

                        <td
                            style="
                                color:var(--box1);
                                font-weight:700;
                            "
                        >
                            ${d.wrong}
                        </td>

                        <td
                            style="
                                font-weight:600;
                            "
                        >

                            ${
                                d.queries > 0

                                ?

                                Math.round(d.rate)
                                + '%'

                                :

                                '–'
                            }

                        </td>

                        <td
                            style="
                                font-size:0.75rem;
                            "
                        >
                            ${dueLabel}
                        </td>

                    </tr>

                `;
            })
            .join('');
    }



    let columnIndex = {

        hz: 0,

        queries: 1,

        correct: 2,

        wrong: 3,

        rate: 4,

        dueDays: 5
    };



    let ths =
        document.querySelectorAll(
            '#box6-stats-table th'
        );


    ths.forEach(
        th =>
            th.classList.remove(
                'sorted-asc',
                'sorted-desc'
            )
    );



    let activeTh =
        ths[
            columnIndex[
                box6SortColumn
            ]
        ];



    if (activeTh) {


        activeTh.classList.add(

            box6SortDirection === 'asc'

            ?

            'sorted-asc'

            :

            'sorted-desc'
        );
    }
}



/* ============================================================
   HANZI WRITER
   ============================================================ */


function startQuizForCurrentChar() {


    if (
        currentQuizCharIndex
        >=
        currentQuizChars.length
    ) {

        return;
    }



    if (currentWriter) {


        try {

            currentWriter.cancelQuiz();

        } catch(e) {}


        currentWriter = null;
    }



    let container =
        document.getElementById(
            'writer-container'
        );


    container.innerHTML = '';



    singleCharBox =
        document.createElement(
            'div'
        );


    singleCharBox.className =
        'char-box';


    container.appendChild(
        singleCharBox
    );



    let char =
        currentQuizChars[
            currentQuizCharIndex
        ];



    requestAnimationFrame(
        () => {


            let boxSize =
                Math.min(
                    window.innerHeight * 0.46,
                    window.innerWidth * 0.86,
                    390
                );



            currentWriter =
                HanziWriter.create(

                    singleCharBox,

                    char,

                    {

                        width: boxSize,

                        height: boxSize,

                        showCharacter: false,

                        showOutline: false,

                        padding:
                            Math.floor(
                                boxSize * 0.05
                            ),

                        strokeColor:
                            '#2563EB'
                    }
                );



            currentWriter.quiz({

                onComplete:
                    function() {


                        setTimeout(
                            () => {


                                currentQuizCharIndex++;


                                if (

                                    currentQuizCharIndex
                                    <
                                    currentQuizChars.length

                                ) {


                                    startQuizForCurrentChar();
                                }

                            },

                            300
                        );
                    }
            });
        }
    );
}



/* ============================================================
   FOCUS
   ============================================================ */


function getFocusCount() {


    let count = 0;


    for (
        let i = 1;
        i <= 6;
        i++
    ) {


        state[
            'box' + i
        ]
        .forEach(c => {


            if (c.inFocus) {

                count++;
            }
        });
    }


    return count;
}



/* ============================================================
   DICTIONARY
   ============================================================ */


function toggleDictMode() {


    dictMode =
        !dictMode;



    let btn =
        document.getElementById(
            'btn-toggle-dict'
        );


    let dictView =
        document.getElementById(
            'dict-view'
        );


    let flashcardElements = [

        'flashcard-content',

        'drawing-controls',

        'learning-tools',

        'special-actions',

        'controls'
    ];



    if (dictMode) {


        btn.style.backgroundColor =
            "var(--primary)";


        btn.style.color =
            "#FFFFFF";


        dictView.classList.remove(
            'hidden'
        );



        flashcardElements
        .forEach(id => {


            let el =
                document.getElementById(
                    id
                );


            if (el) {

                el.classList.add(
                    'hidden'
                );
            }
        });



        document
            .getElementById(
                'dict-search-input'
            )
            .value = "";


        document
            .getElementById(
                'dict-results'
            )
            .innerHTML = "";


        document
            .getElementById(
                'dict-search-input'
            )
            .focus();

function toggleDictFocus(index) {


    let item =
        currentDictResults[
            index
        ];



    if (
        !item.card.inFocus
        &&
        getFocusCount() >= 150

        alert(
            "Das Limit von 150 Vokabeln im Fokus ist erreicht."
        );


        return;
    }



    item.card.inFocus =
        !item.card.inFocus;



    if (
        item.card.inFocus
    ) {


        item.card.correctCount =
            0;
    }



    sessionQueue = [];


    updateUI();


    searchDict();
}



function changeDictBox(
    index,
    newBoxLevel
) {


    let item =
        currentDictResults[
            index
        ];


    let oldBox =
        'box' + item.boxNum;


    let newBox =
        'box' + newBoxLevel;



    if (
        oldBox === newBox
    ) {

        return;
    }



    state[
        oldBox
    ] =

        state[
            oldBox
        ]
        .filter(
            c =>
                c !== item.card
        );



    item.card.lastMovedDate =
        new Date()
            .toDateString();



    if (
        newBox === 'box5'
    ) {


        item.card.box5Streak =
            0;


        item.card.box5LastCorrectDate =
            null;
    }



    state[
        newBox
    ].push(
        item.card
    );


    sessionQueue = [];


    updateUI();


    searchDict();
}

/* ============================================================
   CSV PARSER
   ============================================================ */


function parseCSVLine(text) {


    let fields = [];

    let field = "";

    let inQuotes = false;



    for (
        let i = 0;
        i < text.length;
        i++
    ) {


        let char =
            text[i];



        if (

            char === '"'

            ||

            char === '„'

            ||

            char === '“'

            ||

            char === '”'

        ) {


            inQuotes =
                !inQuotes;


        } else if (

            char === ','

            &&

            !inQuotes

        ) {


            fields.push(
                cleanField(field)
            );


            field = "";


        } else {


            field +=
                char;
        }
    }



    fields.push(
        cleanField(field)
    );


    return fields;
}



function cleanField(str) {


    let t =
        str.trim();



    if (

        (
            t.startsWith('"')

            &&

            t.endsWith('"')
        )

        ||

        (
            t.startsWith('„')

            &&

            t.endsWith('“')
        )

    ) {


        t =
            t.substring(
                1,
                t.length - 1
            );
    }



    return t.trim();
}



/* ============================================================
   CSV IMPORT
   ============================================================ */


function importCSV(file) {


    if (!file) {

        return;
    }



    const targetBox =

        confirm(

            "Vokabeln als bereits bekannt markieren (Box 5)?\nWählen Sie 'Abbrechen' für neue Vokabeln (Box 1)."

        )

        ?

        'box5'

        :

        'box1';



    let detectedLevel =
        "Import";



    let match =

        file.name
            .toLowerCase()
            .match(
                /hsk\s*([1-6])/
            );



    if (match) {


        detectedLevel =
            "HSK " + match[1];
    }



    const reader =
        new FileReader();



    reader.onload =
        (e) => {


            const rows =

                e.target.result
                    .replace(/\r/g, "")
                    .split('\n');



            rows.forEach(r => {


                if (!r.trim()) {

                    return;
                }



                const p =
                    parseCSVLine(r);



                if (
                    p.length >= 3
                ) {


                    state[
                        targetBox
                    ]
                    .push({

                        hz:
                            p[0],

                        py:
                            p[1],

                        de:
                            p[2],

                        sentenceHz:
                            p[3] || '',

                        sentencePy:
                            p[4] || '',

                        sentenceDe:
                            p[5] || '',

                        level:
                            p[6]

                            ?

                            p[6].trim()

                            :

                            detectedLevel,

                        inFocus:
                            false,

                        stats: {

                            queries: 0,

                            correct: 0
                        }
                    });
                }
            });



            sessionQueue = [];


            updateUI();


            next();
        };



    reader.readAsText(
        file
    );
}



/* ============================================================

   ============================================================ */


function next() {


    if (dictMode) {

        return;
    }



    if (
        sessionQueue.length === 0
    ) {


        let pool = [];


        const boxWeights = [

            0,

            16,

            8,

            4,

            2,

            1,

            1
        ];



        if (
            selectedBoxFilter === 6
        ) {


            let cards =
                [...state.box6];



            cards.sort(
                (a, b) => {


                    let dateA =
                        a.lastMovedDate

                        ?

                        new Date(
                            a.lastMovedDate
                        ).getTime()

                        :

                        0;


                    let dateB =
                        b.lastMovedDate

                        ?

                        new Date(
                            b.lastMovedDate
                        ).getTime()

                        :

                        0;


                    return dateA - dateB;
                }
            );



            let targetBatch =
                cards.slice(
                    0,
                    100
                );



            targetBatch
                .forEach(
                    c =>
                        pool.push({
                            c,
                            box: 'box6'
                        })
                );



            for (

                let i =
                    pool.length - 1;

                i > 0;

                i--

            ) {


                const j =
                    Math.floor(
                        Math.random()
                        *
                        (i + 1)
                    );



                [
                    pool[i],
                    pool[j]
                ]
                =
                [
                    pool[j],
                    pool[i]
                ];
            }



            sessionQueue =
                pool;


        } else {


            for (
                let i = 1;
                i <= 6;
                i++
            ) {


                if (

                    selectedBoxFilter !== null

                    &&

                    i !== selectedBoxFilter

                ) {

                    continue;
                }



                state[
                    'box'+i
                ]
                .forEach(c => {


                    if (

                        onlyFocusMode

                        &&

                        !c.inFocus

                    ) {

                        return;
                    }



                    if (!c.stats) {


                        c.stats = {

                            queries: 0,

                            correct: 0
                        };
                    }



                    if (
                        selectedBoxFilter !== null
                    ) {


                        pool.push({

                            c,

                            box:
                                'box'+i
                        });


                    } else {


                        let weight =
                            1;



                        if (!randomMode) {


                            if (

                                ) {


                                    return;
                                }

                        for (

                            pool.push({

                            });
                        }



                        if (

                                });
                            }
                        }
                    }
                });

                    Math.floor(

                        (i + 1)

            document

                .add('hidden');

                )

            );


        statsInfo =

        )

        .remove('hidden');



    let statsElement =
        document.getElementById(

        );



    let statsText =

    if (

        &&

        currentCard.stats.queries > 0

    ) {

                    currentCard.stats.correct

                    /

                    currentCard.stats.queries
                )

                *

            );



        statsText =

            `
            Abgefragt:
            <b>
                ${currentCard.stats.queries}x
            </b>

            &nbsp;|&nbsp;

            Richtig:
            <b>
                ${currentCard.stats.correct}x
            </b>

            (${percent}%)
            `;


    } else {


        statsText =

            "<i>Noch keine Statistik vorhanden</i>";
    }



    if (
        currentBoxName === 'box5'
    ) {


        let streak =
            currentCard.box5Streak || 0;



        statsText +=

            `
            <br>

            <span
                style="
                    color:var(--box5);
                    font-weight:700;
                "
            >
                Box 6 Fortschritt:
                ${streak}
                von 3 Tagen in Folge richtig
            </span>
            `;
    }



    statsElement.innerHTML =

    statsElement
        .classList
        .remove('hidden');



    let btnExample =

        );



    if (
        currentCard.sentenceHz
    ) {


        document
            .getElementById(
                'ex-hz'
            )
            .innerText =
                currentCard.sentenceHz;



        document
            .getElementById(
                'ex-py'
            )
            .innerText =
                currentCard.sentencePy;



        document
            .getElementById(
                'ex-de'
            )
            .innerText =
                currentCard.sentenceDe;



        btnExample.disabled =
            false;


    } else {


        btnExample.disabled =
            true;
    }



    let btnFocus =
        document.getElementById(
            'btn-focus'
        );



    if (
        currentCard.inFocus
    ) {


        btnFocus.innerText =
            "FOKUS AKTIV";


        btnFocus.style.backgroundColor =
            "var(--focus-color)";


        btnFocus.style.color =
            "#FFFFFF";


    } else {


        btnFocus.innerText =
            "FOKUS AKTIVIEREN";


        btnFocus.style.backgroundColor =
            "var(--surface)";


        btnFocus.style.color =
            "var(--focus-color)";

    document
        .getElementById(
            'writer-container'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'drawing-controls'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'learning-tools'
        )
        .classList
        .remove('hidden');



    document
        .getElementById(
            'special-actions'
        )
        .classList
        .remove('hidden');



    document
        .getElementById(
            'controls'
        )
        .classList
        .remove('hidden');
}



/* ============================================================
   RETRY WRITING
   ============================================================ */


function retryCurrentWordWriting() {


    if (!currentCard) {

        return;
    }



    let hCount =
        countHanzi(
            currentCard.hz
        );



    let tagHtml =

        hCount > 0

        ?

        `
        <span class="char-tag">
            (${hCount} ${hCount === 1 ? 'Zeichen' : 'Zeichen'})
        </span>
        `

        :

        '';



    document
        .getElementById(
            'v-de'
        )
        .innerHTML =

            currentCard.de

            +

            tagHtml;



    document
        .getElementById(
            'v-hz'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'v-py'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'v-stats'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'learning-tools'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'special-actions'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'controls'
        )
        .classList
        .add('hidden');



    document
        .getElementById(
            'drawing-controls'
        )
        .classList
        .remove('hidden');



    const container =
        document.getElementById(
            'writer-container'
        );



    container.innerHTML =
        '';



    container
        .classList
        .remove('hidden');



    currentWriter =
        null;


    singleCharBox =
        null;


    currentQuizChars =
        [];



    let cleanHz =

        currentCard.hz

        ?

        currentCard.hz.replace(
            /\s/g,
            ''
        )

        :

        '';



    for (
        let i = 0;
        i < cleanHz.length;
        i++
    ) {


        let code =
            cleanHz.charCodeAt(i);



        if (

            (
                code >= 0x4E00

                &&

                code <= 0x9FFF
            )

            ||

            (
                code >= 0x3400

                &&

                code <= 0x4DBF
            )

        ) {


            currentQuizChars.push(
                cleanHz[i]
            );
        }
    }



    currentQuizCharIndex =
        0;



    if (
        currentQuizChars.length > 0
    ) {


        startQuizForCurrentChar();
    }
}

    ) {

    let statsInfo =

/* ============================================================
   MOVE CARD
   ============================================================ */


function move(step) {


    if (!currentCard) {

        return;
    }



    if (!currentCard.stats) {


        currentCard.stats = {

            queries: 0,

            correct: 0
        };
    }



    currentCard.stats.queries++;



    if (
        step === 1
    ) {


        currentCard.stats.correct++;
    }



    let oldBox =

        Object
            .keys(state)
            .find(
                k =>
                    Array.isArray(state[k])
                    &&
                    state[k].includes(currentCard)
            );



    let today =
        new Date()
            .toDateString();



    if (
        currentCard.lastSeenDate !== today
    ) {


        currentCard.lastSeenDate =
            today;


        currentCard.todayRounds =
            0;
    }



    currentCard.todayRounds++;



    if (
        oldBox === 'box6'
    ) {


        checkBox6DailyReset();


        state.box6Daily.count++;
    }



    let level =
        parseInt(
            oldBox.replace(
                'box',
                ''
            )
        );



    state[
        oldBox
    ] =

        state[
            oldBox
        ]
        .filter(
            c =>
                c !== currentCard
        );



    let effectiveStep =
        step;



    if (
        currentCard.lastMovedDate === today
    ) {


        effectiveStep =
            0;


    } else {


        currentCard.lastMovedDate =
            today;
    }



    if (

        effectiveStep === 1

        &&

        currentCard.inFocus

    ) {


        if (
            !currentCard.correctCount
        ) {


            currentCard.correctCount =
                0;
        }



        currentCard.correctCount++;



        if (
            currentCard.correctCount >= 20
        ) {


            currentCard.inFocus =
                false;


            currentCard.correctCount =
                0;
        }
    }



    let newLevel;



    if (
        oldBox === 'box5'
    ) {


        if (
            step === 1
        ) {


            if (
                !currentCard.box5Streak
            ) {


                currentCard.box5Streak =
                    0;
            }



            let daysDiff =

                currentCard.box5LastCorrectDate

                ?

                daysBetween(
                    currentCard.box5LastCorrectDate,
                    today
                )

                :

                -1;



            if (
                daysDiff === 1
            ) {


                currentCard.box5Streak++;


                currentCard.box5LastCorrectDate =
                    today;


            } else if (
                daysDiff === 0
            ) {


                /* gleicher Tag */


            } else {


                currentCard.box5Streak =
                    1;


                currentCard.box5LastCorrectDate =
                    today;
            }



            if (
                currentCard.box5Streak >= 3
            ) {


                newLevel =
                    6;


                currentCard.box5Streak =
                    0;


                currentCard.box5LastCorrectDate =
                    null;


            } else {


                newLevel =
                    5;
            }


        } else {


            currentCard.box5Streak =
                0;


            currentCard.box5LastCorrectDate =
                null;



            newLevel =

                Math.min(

                    Math.max(

                        level
                        +
                        effectiveStep,

                        1
                    ),

                    6
                );
        }


    } else {


        newLevel =

            Math.min(

                Math.max(

                    level
                    +
                    effectiveStep,

                    1
                ),

                6
            );
    }



    if (
        oldBox === 'box6'
    ) {


        if (
            newLevel === 6
        ) {


            if (
                effectiveStep === 1
            ) {


                currentCard.box6Interval =

                    currentCard.box6Interval

                    ?

                    Math.min(
                        currentCard.box6Interval * 2,
                        60
                    )

                    :

                    2;


            } else if (
                !currentCard.box6Interval
            ) {


                currentCard.box6Interval =
                    1;
            }



            currentCard.nextReviewDate =

                addDays(
                    today,
                    currentCard.box6Interval
                );


        } else {


            currentCard.box6Interval =
                0;


            currentCard.nextReviewDate =
                null;
        }
    }



    state[
        'box' + newLevel
    ].push(
        currentCard
    );



    updateUI();


    next();
}



/* ============================================================
   MOVE TO BOX 6
   ============================================================ */


function moveToBox6() {


    if (!currentCard) {

        return;
    }



    let oldBox =

        Object
            .keys(state)
            .find(
                k =>
                    Array.isArray(state[k])
                    &&
                    state[k].includes(currentCard)
            );



    if (oldBox) {


        state[
            oldBox
        ] =

            state[
                oldBox
            ]
            .filter(
                c =>
                    c !== currentCard
            );
    }



    currentCard.lastMovedDate =
        new Date()
            .toDateString();



    currentCard.box5Streak =
        0;



    currentCard.box5LastCorrectDate =
        null;



    currentCard.box6Interval =
        1;



    currentCard.nextReviewDate =
        null;



    state.box6.push(
        currentCard
    );



    updateUI();


    next();
}

}



/* ============================================================
   BACKUP
   ============================================================ */


function exportProgress() {


    const dataStr =

        "data:text/json;charset=utf-8,"

        +

        encodeURIComponent(

            JSON.stringify(
                state
            )
        );



    const dl =
        document.createElement(
            'a'
        );



    dl.setAttribute(

        "href",

        dataStr
    );



    dl.setAttribute(

        "download",

        "hsk_trainer_backup.json"
    );



    dl.click();
}



/* ============================================================
   RESTORE BACKUP
   ============================================================ */


function importProgress(file) {


    const reader =
        new FileReader();



    reader.onload =
        (e) => {


            state =
                JSON.parse(
                    e.target.result
                );



            if (!state.box6) {


                state.box6 =
                    [];
            }



            if (!state.box6Daily) {


                state.box6Daily = {

                    date:
                        new Date()
                            .toDateString(),

                    count:
                        0
                };
            }



            sessionQueue =
                [];


            updateUI();


            next();
        };



    reader.readAsText(
        file
    );
}

   WRITER RESET
   ============================================================ */


function clearCanvas() {


    if (currentWriter) {


        try {

            currentWriter.cancelQuiz();

        } catch(e) {}
    }



    currentQuizCharIndex =
        0;



    startQuizForCurrentChar();
}



/* ============================================================
   AUDIO
   ============================================================ */


function speak() {


    if (!currentCard) {

        return;
    }



    window
        .speechSynthesis
        .cancel();



    const u =

        new SpeechSynthesisUtterance(
            currentCard.hz
        );



    u.lang =
        'zh-CN';



    window
        .speechSynthesis
        .speak(u);
}

updateUI();

next();
