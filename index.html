<style id="hsk-premium-ui-override">
/* ============================================================
   HSK TRAINER — PREMIUM UI OVERRIDE
   Drop-in: Diesen Block ans ENDE des vorhandenen <style>-Blocks
   setzen. Keine JS- oder HTML-Logik muss geändert werden.
   ============================================================ */

:root {
    --bg: #f4f7fb;
    --bg-elevated: rgba(255, 255, 255, 0.82);
    --card: #ffffff;
    --card-soft: #f8fafc;
    --text-main: #16181d;
    --text-muted: #667085;
    --text-faint: #98a2b3;
    --border-light: rgba(16, 24, 40, 0.08);
    --border-strong: rgba(16, 24, 40, 0.13);

    --primary: #2563eb;
    --primary-strong: #1d4ed8;
    --primary-light: #dbeafe;
    --primary-soft: #eff6ff;
    --focus-color: #7c3aed;

    --box1: #ef4444;
    --box2: #f59e0b;
    --box3: #3b82f6;
    --box4: #8b5cf6;
    --box5: #22c55e;
    --box6: #ec4899;

    --shadow-subtle: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 6px rgba(16, 24, 40, 0.05);
    --shadow-card: 0 20px 50px rgba(16, 24, 40, 0.10), 0 6px 18px rgba(16, 24, 40, 0.06);
    --shadow-float: 0 12px 28px rgba(16, 24, 40, 0.12), 0 4px 10px rgba(16, 24, 40, 0.05);

    --radius-btn: 14px;
    --radius-card: 24px;
    --radius-pill: 999px;

    --btn-highlight: transparent;
    --btn-shade: transparent;
    --btn-shadow-raised: 0 6px 14px rgba(16, 24, 40, 0.08), 0 1px 3px rgba(16, 24, 40, 0.06);
    --btn-shadow-pressed: inset 0 2px 6px rgba(16, 24, 40, 0.12), 0 1px 2px rgba(16, 24, 40, 0.04);
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0b0d12;
        --bg-elevated: rgba(20, 23, 31, 0.82);
        --card: #14171f;
        --card-soft: #181c25;
        --text-main: #f4f7fb;
        --text-muted: #aeb7c6;
        --text-faint: #7f8999;
        --border-light: rgba(255, 255, 255, 0.08);
        --border-strong: rgba(255, 255, 255, 0.13);

        --primary: #6ea8ff;
        --primary-strong: #8ab8ff;
        --primary-light: rgba(37, 99, 235, 0.22);
        --primary-soft: rgba(37, 99, 235, 0.10);
        --focus-color: #b08cff;

        --box1: #ff6b6b;
        --box2: #fbbf24;
        --box3: #60a5fa;
        --box4: #a78bfa;
        --box5: #4ade80;
        --box6: #f472b6;

        --shadow-subtle: 0 1px 2px rgba(0, 0, 0, 0.26), 0 3px 10px rgba(0, 0, 0, 0.22);
        --shadow-card: 0 22px 56px rgba(0, 0, 0, 0.42), 0 8px 20px rgba(0, 0, 0, 0.28);
        --shadow-float: 0 14px 34px rgba(0, 0, 0, 0.38), 0 4px 12px rgba(0, 0, 0, 0.24);
        --btn-shadow-raised: 0 7px 16px rgba(0, 0, 0, 0.28), 0 1px 3px rgba(0, 0, 0, 0.28);
        --btn-shadow-pressed: inset 0 2px 7px rgba(0, 0, 0, 0.42), 0 1px 2px rgba(255, 255, 255, 0.03);
    }
}

html,
body {
    min-height: 100%;
    background:
        radial-gradient(circle at 12% 0%, rgba(37, 99, 235, 0.12), transparent 31rem),
        radial-gradient(circle at 100% 18%, rgba(124, 58, 237, 0.08), transparent 26rem),
        var(--bg);
}

body {
    font-feature-settings: "ss01" on, "cv02" on, "cv03" on;
    text-rendering: optimizeLegibility;
}

.container {
    max-width: 560px;
    padding:
        max(14px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(14px, env(safe-area-inset-left));
}

/* ---------- Header ---------- */
.header {
    gap: 9px;
    margin-bottom: 11px;
}

.header-top {
    gap: 10px;
}

.header-top h2 {
    font-size: clamp(1.2rem, 4vw, 1.45rem);
    line-height: 1;
    letter-spacing: -0.045em;
    background: linear-gradient(110deg, var(--text-main), var(--primary));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
}

.system-buttons,
.filter-buttons {
    gap: 7px;
}

.system-buttons button,
.filter-buttons button {
    min-height: 44px;
    border: 1px solid var(--border-light);
    background: var(--bg-elevated);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: var(--shadow-subtle);
    text-shadow: none;
}

.system-buttons button {
    padding: 8px 3px;
    font-size: 0.61rem;
    letter-spacing: 0.025em;
}

.system-buttons .btn-action {
    background: linear-gradient(135deg, var(--primary), var(--primary-strong));
    color: #fff;
    border-color: transparent;
}

.system-buttons .btn-stats {
    background: linear-gradient(135deg, color-mix(in srgb, var(--box6) 11%, var(--card)), var(--card));
    color: var(--box6);
}

.system-buttons .btn-danger {
    color: var(--box1);
}

.filter-buttons button {
    padding: 10px 7px;
    font-size: 0.72rem;
    letter-spacing: -0.01em;
}

/* ---------- Box 6 Tagesfortschritt ---------- */
#box6-daily-progress {
    position: relative;
    overflow: hidden;
    padding: 10px 14px 10px 42px;
    min-height: 40px;
    justify-content: center;
    border: 1px solid color-mix(in srgb, var(--box6) 20%, var(--border-light));
    background: linear-gradient(135deg, color-mix(in srgb, var(--box6) 9%, var(--card)), var(--card));
    box-shadow: var(--shadow-subtle);
    font-size: 0.70rem;
    letter-spacing: 0.045em;
}

#box6-daily-progress::before {
    content: "6";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 22px;
    height: 22px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--box6);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 800;
    box-shadow: 0 6px 12px color-mix(in srgb, var(--box6) 28%, transparent);
}

/* ---------- Box-Statistik ---------- */
.stats {
    gap: 7px;
    padding: 8px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: 1px solid var(--border-light);
    background: var(--bg-elevated);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: var(--shadow-subtle);
}

.stat-box {
    min-height: 48px;
    padding: 8px 2px 7px;
    border-radius: 11px;
    border-width: 1px;
    background: transparent;
    box-shadow: none;
    font-size: 0.64rem;
    line-height: 1.25;
    letter-spacing: 0.01em;
}

.stat-box span[id^="stat-count-"] {
    display: inline-block;
    margin-top: 2px;
    font-size: 0.86rem;
    font-weight: 800;
}

.stat-box.active-box {
    background: var(--card-soft);
    border-color: var(--border-strong);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
}

.stat-box.selected-box {
    transform: translateY(-1px);
    background: color-mix(in srgb, currentColor 7%, var(--card)) !important;
    box-shadow: 0 6px 16px color-mix(in srgb, currentColor 13%, transparent);
}

.stat-box.inactive-box {
    opacity: 0.34;
}

.daily-badge {
    top: -5px;
    right: -5px;
    min-width: 17px;
    height: 17px;
    border: 2px solid var(--card);
    font-size: 0.52rem;
    box-shadow: 0 3px 8px rgba(16, 24, 40, 0.16);
}

/* ---------- Hauptkarte ---------- */
.card {
    position: relative;
    padding: 18px 18px 16px;
    border-radius: 28px;
    border: 1px solid var(--border-light);
    background:
        linear-gradient(180deg, rgba(255,255,255,0.035), transparent 18%),
        var(--card);
    box-shadow: var(--shadow-card);
}

.card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background: linear-gradient(180deg, rgba(255,255,255,0.10), transparent 18%);
    opacity: 0.7;
}

.card-content,
#dict-view,
.action-area {
    position: relative;
    z-index: 1;
}

.card-content {
    gap: clamp(9px, 2vh, 14px);
}

#v-box {
    min-height: 30px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 7px 13px;
    border: 1px solid var(--border-light);
    background: var(--card-soft);
    border-radius: var(--radius-pill);
    font-size: 0.66rem;
    color: var(--text-muted);
    letter-spacing: 0.075em;
    box-shadow: none;
}

#v-de {
    width: min(100%, 440px);
    font-size: clamp(1.25rem, 4.4vw, 1.65rem);
    line-height: 1.28;
    letter-spacing: -0.015em;
}

.char-tag {
    width: fit-content;
    margin: 8px auto 0;
    padding: 4px 9px;
    border-radius: var(--radius-pill);
    background: var(--primary-soft);
    font-size: 0.73rem;
    color: var(--primary);
}

#v-hz {
    font-size: clamp(3.8rem, 16vw, 5.7rem);
    letter-spacing: -0.05em;
    text-shadow: 0 10px 22px rgba(16, 24, 40, 0.08);
}

#v-hz.long-char {
    font-size: clamp(2.5rem, 10vw, 3.8rem);
    letter-spacing: -0.035em;
}

#v-py {
    font-size: clamp(1.05rem, 4vw, 1.35rem);
    color: var(--primary);
}

#v-stats {
    max-width: 100%;
    margin-top: 2px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--border-light);
    background: var(--card-soft);
    font-size: 0.78rem;
    line-height: 1.45;
    box-shadow: none;
}

/* ---------- Schreibfläche ---------- */
.writer-grid {
    min-height: 0;
}

.char-box {
    width: min(100%, 390px);
    max-width: 390px;
    max-height: 390px;
    border-radius: 22px;
    border: 1px solid var(--border-strong);
    background:
        linear-gradient(90deg, transparent 49.7%, color-mix(in srgb, var(--border-strong) 55%, transparent) 50%, transparent 50.3%),
        linear-gradient(0deg, transparent 49.7%, color-mix(in srgb, var(--border-strong) 55%, transparent) 50%, transparent 50.3%),
        var(--card-soft);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.035), inset 0 0 0 1px rgba(255,255,255,0.02);
}

.char-box:active {
    border-color: color-mix(in srgb, var(--primary) 70%, var(--border-strong));
    box-shadow: 0 0 0 4px var(--primary-soft);
}

/* ---------- Buttons ---------- */
button {
    min-height: 42px;
    border: 1px solid transparent;
    box-shadow: var(--btn-shadow-raised);
    text-shadow: none;
    letter-spacing: -0.005em;
    transform: translateZ(0);
}

button:hover {
    filter: brightness(1.015);
}

button:active {
    transform: translateY(1px) scale(0.985);
    filter: brightness(0.985);
}

.btn-large {
    min-height: 52px;
    padding: 13px 14px;
    border-radius: 15px;
    font-size: 0.92rem;
    letter-spacing: 0.035em;
}

.btn-medium {
    min-height: 46px;
    padding: 11px 12px;
    border-radius: 14px;
    font-size: 0.86rem;
}

.btn-tool {
    min-height: 48px;
    padding: 11px 5px;
    border-radius: 14px;
    border: 1px solid var(--border-light);
    background: var(--card-soft);
    font-size: 0.78rem;
    letter-spacing: 0.045em;
}

.btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-strong));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 8px 18px color-mix(in srgb, var(--primary) 24%, transparent);
}

.btn-secondary {
    background: var(--card-soft);
    color: var(--text-main);
    border-color: var(--border-light);
}

.btn-grade {
    min-height: 52px;
    padding: 12px 4px;
    border-radius: 15px;
    font-size: 0.79rem;
    letter-spacing: 0.04em;
    box-shadow: 0 8px 18px rgba(16, 24, 40, 0.10);
}

#controls .btn-grade:nth-child(1) {
    background: linear-gradient(135deg, color-mix(in srgb, var(--box1) 92%, white), var(--box1)) !important;
}

#controls .btn-grade:nth-child(2) {
    background: linear-gradient(135deg, color-mix(in srgb, var(--box2) 92%, white), var(--box2)) !important;
}

#controls .btn-grade:nth-child(3) {
    background: linear-gradient(135deg, color-mix(in srgb, var(--box5) 92%, white), var(--box5)) !important;
}

.action-area {
    padding-top: 14px;
    gap: 9px;
}

.row-2,
.row-3 {
    gap: 9px;
}

/* ---------- Wörterbuch ---------- */
#dict-view {
    min-height: 0;
}

#dict-search-input {
    min-height: 48px;
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    background: var(--card-soft);
    box-shadow: none;
    font-size: 0.95rem;
}

#dict-search-input::placeholder {
    color: var(--text-faint);
}

#dict-search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px var(--primary-soft);
}

#dict-results {
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}

#dict-results > div {
    border-radius: 16px !important;
    background: var(--card-soft) !important;
    border-color: var(--border-light) !important;
    box-shadow: none !important;
}

/* ---------- Modal ---------- */
.modal-overlay {
    padding: max(18px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
    background: rgba(8, 11, 18, 0.58);
    backdrop-filter: blur(18px) saturate(125%);
    -webkit-backdrop-filter: blur(18px) saturate(125%);
}

.modal-content {
    max-width: 430px;
    max-height: min(82vh, 760px);
    padding: 22px;
    border-radius: 24px;
    border: 1px solid var(--border-light);
    background: var(--card);
    box-shadow: 0 28px 72px rgba(0, 0, 0, 0.28);
}

.modal-content h3 {
    letter-spacing: 0.035em !important;
}

#box6StatsModal .modal-content {
    max-width: min(94vw, 540px) !important;
}

#box6-stats-summary {
    padding: 8px 10px;
    border-radius: 10px;
    background: var(--card-soft);
    color: var(--text-muted);
}

#box6-stats-table {
    font-size: 0.80rem;
}

#box6-stats-table th {
    padding: 10px 7px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 0.62rem;
    border-bottom-color: var(--border-strong);
}

#box6-stats-table td {
    padding: 10px 7px;
}

/* ---------- Scrollbars ---------- */
* {
    scrollbar-width: thin;
    scrollbar-color: var(--border-strong) transparent;
}

*::-webkit-scrollbar {
    width: 7px;
    height: 7px;
}

*::-webkit-scrollbar-track {
    background: transparent;
}

*::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 999px;
}

/* ---------- Accessibility ---------- */
button:focus-visible,
.stat-box:focus-visible,
input:focus-visible,
select:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px var(--primary-soft), var(--shadow-subtle);
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
    }
}

/* ---------- Kleine Smartphones ---------- */
@media (max-width: 390px) {
    .container {
        padding-left: 10px;
        padding-right: 10px;
    }

    .system-buttons,
    .filter-buttons,
    .stats,
    .row-2,
    .row-3 {
        gap: 6px;
    }

    .system-buttons button {
        min-height: 40px;
        font-size: 0.56rem;
    }

    .filter-buttons button {
        font-size: 0.66rem;
    }

    .stats {
        padding: 7px;
    }

    .stat-box {
        min-height: 44px;
        font-size: 0.58rem;
    }

    .card {
        padding: 15px 14px 14px;
        border-radius: 24px;
    }

    .btn-grade,
    .btn-large {
        min-height: 48px;
    }

    .btn-tool {
        min-height: 45px;
        font-size: 0.72rem;
    }
}

/* ---------- Foldables / breite Phones ---------- */
@media (min-width: 500px) and (max-width: 900px) {
    .container {
        max-width: 620px;
    }

    .card {
        padding-left: 22px;
        padding-right: 22px;
    }
}

</style>
