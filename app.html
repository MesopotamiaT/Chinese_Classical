<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Trainer</title>
</head>
<body>
<script>
(async () => {
    try {
        const response = await fetch(
            './index.html?fresh=' + Date.now(),
            {
                cache: 'no-store',
                headers: {
                    'Cache-Control': 'no-cache'
                }
            }
        );

        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const html = await response.text();

        document.open();
        document.write(html);
        document.close();

    } catch (error) {

        document.body.innerHTML =
            '<p style="font-family:sans-serif;padding:24px">' +
            'Die aktuelle App-Version konnte nicht geladen werden.' +
            '</p>';
    }
})();
</script>
</body>
</html>
