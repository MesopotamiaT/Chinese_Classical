<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HSK Trainer">
    <title>HSK Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        /* Hochwertiges, mattes Farbkonzept */
        :root { 
            --bg: #F3F4F6; 
            --card: #FFFFFF; 
            --text-main: #111827; 
            --text-muted: #6B7280;
            --border-light: #E5E7EB;
            
            --primary: #2563EB; 
            --primary-light: #EFF6FF;
            --focus-color: #4F46E5; 
            
            /* Gedämpfte Status-Farben */
            --box1: #DC2626; 
            --box2: #D97706; 
            --box3: #0284C7; 
            --box4: #7C3AED; 
            --box5: #059669; 
            
            --shadow-subtle: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-btn: 8px;
            --radius-card: 16px;
        }

        /* Eleganter Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121212; 
                --card: #1E1E1E; 
                --text-main: #F9FAFB; 
                --text-muted: #9CA3AF;
                --border-light: #2C2C2C;
                
                --primary: #3B82F6; 
                --primary-light: #1E3A8A;
                --focus-color: #6366F1; 
                
                --box1: #EF4444; 
                --box2: #F59E0B; 
                --box3: #3B82F6; 
                --box4: #8B5CF6; 
                --box5: #10B981; 
                
                --shadow-card: 0 8px 16px rgba(0, 0, 0, 0.4);
            }
        }
        
        * { box-sizing: border-box; }
        
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            background: var(--bg); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            letter-spacing: -0.015em;
        }
        
        .container { 
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            padding: 12px; 
            overflow-x: hidden;
        }
        
        /* HEADER */
        .header {
            display: flex;
            flex-direction: column;
            gap: 10px; 
            flex-shrink: 0;
            margin-bottom: 12px;
            width: 100%;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            width: 100%;
        }
        
        .header-top h2 {
            margin: 0;
            font-size: 1.2rem; 
            font-weight: 700;
            letter-spacing: -0.03em;
            flex-shrink: 0;
        }
        
        .system-buttons { 
            display: flex; 
            gap: 4px; 
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 100%;
        }
        
        .system-buttons button {
            font-size: 0.7rem; 
            padding: 6px 8px; 
            border-radius: var(--radius-btn);
            background: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            white-space: nowrap;
            flex-shrink: 1;
        }
        .system-buttons .btn-danger { color: var(--box1); border-color: var(--border-light); }
        .system-buttons .btn-action { background: var(--primary); color: #FFFFFF; border: none; }

        .filter-buttons { 
            display: flex; 
            gap: 6px; 
            width: 100%;
            flex-wrap: wrap;
        }
        
        .filter-buttons button {
            flex: 1 1 auto; 
            min-width: 0;
            font-size: 0.75rem; 
            padding: 8px 4px; 
            border-radius: var(--radius-btn);
            border: 1px solid var(--border-light);
            background: var(--card);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: var(--shadow-subtle);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* STATISTIK / BOXEN-FILTER */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            background: var(--card);
            padding: 10px; 
            border-radius: var(--radius-btn);
            border: 1px solid var(--border-light);
            flex-shrink: 0;
            margin-bottom: 14px; 
            box-shadow: var(--shadow-subtle);
        }
        .stat-box { 
            padding: 8px 4px; 
            border-radius: 6px; 
            text-align: center; 
            font-size: 0.8rem; 
            font-weight: 600; 
            border: 2px solid transparent;
            color: var(--text-muted);
            background: transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #stat-box-1 { color: var(--box1); }
        #stat-box-2 { color: var(--box2); }
        #stat-box-3 { color: var(--box3); }
        #stat-box-4 { color: var(--box4); }
        #stat-box-5 { color: var(--box5); }
        
        .stat-box.selected-box { 
            border-color: currentColor !important; 
            background: var(--bg) !important;
            opacity: 1 !important;
            transform: scale(1.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }
        
        .stat-box.active-box { 
            border-color: var(--border-light); 
            background: var(--bg);
        }
        .stat-box.inactive-box { opacity: 0.3; }

        /* HAUPTKARTE */
        .card { 
            background: var(--card); 
            border-radius: var(--radius-card); 
            box-shadow: var(--shadow-card); 
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            padding: 16px 20px; 
        }
        
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px; 
            flex-grow: 1;
            text-align: center;
        }

        #v-box { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            background: var(--bg);
            border-radius: 20px;
            border: 1px solid var(--border-light);
        }

        #v-de {
            font-size: 1.5rem; 
            font-weight: 600; 
            color: var(--text-main); 
            word-break: break-word; 
            line-height: 1.3;
            margin: 0;
            letter-spacing: -0.01em;
        }

        /* Styling für den Hinweis zur Zeichenanzahl */
        #v-char-count {
            font-size: 0.95rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: 2px;
        }
        
        #v-hz {
            font-size: 5rem; 
            color: var(--text-main);
            font-weight: 400;
            line-height: 1;
            margin: 0;
        }
        #v-hz.long-char { font-size: 3.5rem; }

        #v-py {
            font-size: 1.25rem; 
            color: var(--primary); 
            font-weight: 500; 
            margin: 0;
            letter-spacing: 0.02em;
        }
        
        /* Neues Statistik-Feld auf der Karte */
        #v-stats {
            margin-top: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: var(--bg);
            padding: 6px 14px;
            border-radius: var(--radius-btn);
            border: 1px solid var(--border-light);
            font-weight: 500;
        }
        
        /* ZEICHENBOX */
        .writer-grid { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100%;
        }
        
        .char-box { 
            width: 100%;
            height: 100%;
            max-width: 400px;  
            max-height: 400px; 
            aspect-ratio: 1/1; 
            border: 1px solid var(--border-light); 
            border-radius: var(--radius-card); 
            background: var(--bg); 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
            transition: border-color 0.2s;
            touch-action: none;
        }
        .char-box:active { border-color: var(--primary); }

        /* ACTION BUTTONS */
        .action-area {
            margin-top: auto; 
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        button { 
            border: none; 
            margin: 0; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button:disabled { opacity: 0.4 !important; cursor: not-allowed; transform: none; }
        
        .row-2 { display: flex; gap: 8px; width: 100%; }
        .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        
        .btn-large { padding: 16px; border-radius: var(--radius-btn); font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .btn-medium { padding: 14px; border-radius: var(--radius-btn); font-size: 0.95rem; }
        
        .btn-primary { background: var(--primary); color: #FFFFFF; flex: 2; }
        .btn-secondary { background: var(--card); color: var(--text-main); border: 1px solid var(--border-light); flex: 1; }
        
        .btn-tool { 
            background: var(--card); 
            color: var(--text-main); 
            border: 1px solid var(--border-light);
            padding: 14px 4px; 
            font-size: 0.9rem; 
            border-radius: var(--radius-btn); 
            box-shadow: var(--shadow-subtle);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .btn-grade { color: #FFFFFF; padding: 16px 4px; font-size: 0.95rem; border-radius: var(--radius-btn); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
        
        .hidden { display: none !important; }
        
        /* MODAL */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; padding: 20px; 
        }
        .modal-content { 
            background: var(--card); padding: 24px; border-radius: var(--radius-card); 
            width: 100%; max-width: 400px; max-height: 80vh; 
            display: flex; flex-direction: column; box-shadow: var(--shadow-card); 
        }
        
        /* Wörterbuch Styling */
        #dict-search-input {
            flex-grow: 1; padding: 14px; border-radius: var(--radius-btn); 
            border: 1px solid var(--border-light); font-size: 1rem; 
            background: var(--bg); color: var(--text-main); 
            font-family: inherit; outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-top">
            <h2>HSK Trainer</h2>
            <div class="system-buttons">
                <input type="file" id="csvFile" class="hidden" onchange="importCSV(this.files[0])" accept=".csv">
                <button class="btn-action" onclick="document.getElementById('csvFile').click()">CSV</button>
                <button onclick="exportProgress()">Backup</button>
                <input type="file" id="jsonFile" class="hidden" onchange="importProgress(this.files[0])" accept=".json">
                <button onclick="document.getElementById('jsonFile').click()">Laden</button>
                <button class="btn-danger" onclick="resetSpeicher()">Reset</button>
            </div>
        </div>
        <div class="filter-buttons">
            <button id="btn-toggle-only-focus" onclick="toggleOnlyFocusMode()">ALLE KARTEN (0)</button>
            <button id="btn-toggle-random-mode" onclick="toggleRandomMode()">ZUFALLSMODUS AUS</button>
            <button id="btn-toggle-dict" onclick="toggleDictMode()">WÖRTERBUCH</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
        
        <div id="dict-view" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0;">
                <input type="text" id="dict-search-input" placeholder="Nach Begriff suchen..." onkeypress="if(event.key === 'Enter') searchDict()">
                <button class="btn-primary btn-medium" style="flex: 0 1 auto; padding: 0 20px;" onclick="searchDict()">SUCHEN</button>
            </div>
            <div id="dict-results" style="overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <div id="flashcard-content" class="card-content">
            <div id="v-box"></div>
            <div id="v-de">Bitte CSV laden...</div>
            <div id="v-char-count"></div>
            
            <div id="v-hz" class="hidden"></div>
            <div id="v-py" class="hidden"></div>
            <div id="v-stats" class="hidden"></div>
            
            <div id="writer-container" class="writer-grid hidden"></div>
        </div>
        
        <div class="action-area">
            
            <div id="drawing-controls" class="row-2 hidden">
                <button id="btn-clear" class="btn-secondary btn-large" onclick="clearCanvas()">LÖSCHEN</button>
                <button id="btn-show" class="btn-primary btn-large" onclick="flip()">LÖSUNG</button>
            </div>

            <div id="learning-tools" class="row-3 hidden">
                <button class="btn-tool" onclick="speak()">AUDIO</button>
                <button class="btn-tool" onclick="retryCurrentWordWriting()">ÜBEN</button>
                <button id="btn-example-trigger" class="btn-tool" onclick="openModal()">BEISPIEL</button>
            </div>
            
            <div id="special-actions" class="row-2 hidden">
                <button id="btn-focus" class="btn-secondary btn-medium" style="color: var(--focus-color); border-color: var(--focus-color);" onclick="toggleFocus()">FOKUS AKTIVIEREN</button>
                <button class="btn-secondary btn-medium" onclick="moveToBox5()">ZU BOX 5</button>
            </div>
            
            <div id="controls" class="row-3 hidden">
                <button class="btn-grade" style="background: var(--box1);" onclick="move(-1)">FALSCH</button>
                <button class="btn-grade" style="background: var(--box2);" onclick="move(0)">HALTEN</button>
                <button class="btn-grade" style="background: var(--box5);" onclick="move(1)">RICHTIG</button>
            </div>
            
        </div>
    </div>
</div>

<div id="exampleModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--text-main); font-size: 1.1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;">Beispielsatz</h3>
        <div style="overflow-y: auto; flex-grow: 1; margin-bottom: 16px;">
            <div id="ex-hz" style="font-size: 1.6rem; font-weight: 400; margin-bottom: 6px;"></div>
            <div id="ex-py" style="color: var(--primary); margin-bottom: 12px; font-size: 1.1rem;"></div>
            <div id="ex-de" style="background: var(--bg); padding: 16px; border-radius: var(--radius-btn); border-left: 4px solid var(--primary); font-size: 1rem; line-height: 1.5; color: var(--text-main);"></div>
        </div>
        <button class="btn-secondary btn-large" onclick="closeModal()">SCHLIESSEN</button>
    </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('hsk_data')) || { box1: [], box2: [], box3: [], box4: [], box5: [] };
let sessionQueue = []; 
let currentCard = null;
let currentBoxName = ""; 

let currentQuizChars = [];
let currentQuizCharIndex = 0;
let currentWriter = null;
let singleCharBox = null;

let onlyFocusMode = false; 
let randomMode = false;       
let selectedBoxFilter = null; 
let dictMode = false;       
let currentDictResults = []; 

document.getElementById('stats').innerHTML = [1,2,3,4,5].map(i => 
    `<div id="stat-box-${i}" class="stat-box">BOX ${i}<br><span id="stat-count-${i}">0</span></div>`
).join('');

[1,2,3,4,5].forEach(i => {
    document.getElementById(`stat-box-${i}`).addEventListener('click', () => {
        if (dictMode) toggleDictMode();
        
        sessionQueue = []; 
        
        if (selectedBoxFilter === i) {
            selectedBoxFilter = null; 
        } else {
            selectedBoxFilter = i;
            if (randomMode) toggleRandomMode();
            if (onlyFocusMode) toggleOnlyFocusMode();
        }
        updateUI();
        next();
    });
});

function getHanziChars(str) {
    if (!str) return [];
    // Universeller Unicode-Filter für chinesische Schriftzeichen (Han)
    return str.match(/\p{Script=Han}/gu) || [];
}

function startQuizForCurrentChar() {
    if (currentQuizCharIndex >= currentQuizChars.length) return;
    
    if (currentWriter) {
        try { currentWriter.cancelQuiz(); } catch(e) {}
        currentWriter = null;
    }
    
    let container = document.getElementById('writer-container');
    container.innerHTML = ''; 
    
    singleCharBox = document.createElement('div');
    singleCharBox.className = 'char-box';
    container.appendChild(singleCharBox);
    
    let char = currentQuizChars[currentQuizCharIndex];
    
    requestAnimationFrame(() => {
        let boxSize = Math.min(window.innerHeight * 0.5, window.innerWidth * 0.9, 400);
        
        currentWriter = HanziWriter.create(singleCharBox, char, { 
            width: boxSize, 
            height: boxSize, 
            showCharacter: false, 
            showOutline: false, 
            padding: Math.floor(boxSize * 0.05), 
            strokeColor: '#3B82F6' 
        });
        
        currentWriter.quiz({
            onComplete: function() {
                setTimeout(() => {
                    currentQuizCharIndex++;
                    if (currentQuizCharIndex < currentQuizChars.length) {
                        startQuizForCurrentChar();
                    }
                }, 300); 
            }
        });
    });
}

function getFocusCount() {
    let count = 0;
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            if (c.inFocus) count++;
        });
    }
    return count;
}

function toggleDictMode() {
    dictMode = !dictMode;
    let btn = document.getElementById('btn-toggle-dict');
    let dictView = document.getElementById('dict-view');
    let flashcardElements = ['flashcard-content', 'drawing-controls', 'learning-tools', 'special-actions', 'controls'];
    
    if (dictMode) {
        btn.style.background = "var(--primary)";
        btn.style.color = "#FFFFFF";
        dictView.classList.remove('hidden');
        
        flashcardElements.forEach(id => {
            let el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        });
        
        document.getElementById('dict-search-input').value = "";
        document.getElementById('dict-results').innerHTML = "";
        document.getElementById('dict-search-input').focus();
    } else {
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        dictView.classList.add('hidden');
        document.getElementById('flashcard-content').classList.remove('hidden');
        next(); 
    }
}

function searchDict() {
    let query = document.getElementById('dict-search-input').value.trim().toLowerCase();
    let resultsContainer = document.getElementById('dict-results');
    resultsContainer.innerHTML = "";
    
    if (!query) return;

    let allCards = [];
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            allCards.push({ card: c, boxNum: i });
        });
    }

    currentDictResults = allCards.filter(item => 
        item.card.de.toLowerCase().includes(query) || 
        item.card.py.toLowerCase().includes(query) ||
        item.card.hz.includes(query)
    );

    if (currentDictResults.length === 0) {
        resultsContainer.innerHTML = "<p style='color: var(--text-muted); text-align: center; font-size: 0.95rem; margin-top: 20px;'>Keine Ergebnisse gefunden.</p>";
        return;
    }

    currentDictResults.forEach((item, index) => {
        let c = item.card;
        let boxNum = item.boxNum;
        let div = document.createElement('div');
        div.style.cssText = "background: var(--bg); padding: 16px; border-radius: var(--radius-btn); border: 1px solid var(--border-light);";
        
        let focusBtnBg = c.inFocus ? "var(--focus-color)" : "transparent";
        let focusBtnColor = c.inFocus ? "#FFFFFF" : "var(--text-main)";
        let focusBtnBorder = c.inFocus ? "var(--focus-color)" : "var(--border-light)";
        let focusBtnText = c.inFocus ? "FOKUS AKTIV" : "FOKUS";

        let html = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div style="font-size: 1.5rem; font-weight: 500;">${c.hz}</div>
                <div style="display: flex; gap: 6px;">
                    <button onclick="toggleDictFocus(${index})" style="padding: 6px 10px; font-size: 0.75rem; border-radius: var(--radius-btn); background: ${focusBtnBg}; color: ${focusBtnColor}; border: 1px solid ${focusBtnBorder};">${focusBtnText}</button>
                    <select onchange="changeDictBox(${index}, this.value)" style="background: var(--box${boxNum}); color: white; padding: 6px 10px; border-radius: var(--radius-btn); font-size: 0.8rem; font-weight: 600; border: none; outline: none;">
                        <option value="1" style="color: black; background: white;" ${boxNum == 1 ? 'selected' : ''}>B1</option>
                        <option value="2" style="color: black; background: white;" ${boxNum == 2 ? 'selected' : ''}>B2</option>
                        <option value="3" style="color: black; background: white;" ${boxNum == 3 ? 'selected' : ''}>B3</option>
                        <option value="4" style="color: black; background: white;" ${boxNum == 4 ? 'selected' : ''}>B4</option>
                        <option value="5" style="color: black; background: white;" ${boxNum == 5 ? 'selected' : ''}>B5</option>
                    </select>
                </div>
            </div>
            <div style="color: var(--primary); font-size: 1rem; margin-bottom: 6px;">${c.py}</div>
            <div style="font-size: 1.05rem; font-weight: 500;">${c.de}</div>
        `;
        
        if (c.sentenceHz) {
            html += `
                <div style="border-top: 1px solid var(--border-light); padding-top: 10px; margin-top: 10px; font-size: 0.9rem;">
                    <div style="color: var(--text-main); font-weight: 500;">${c.sentenceHz}</div>
                    <div style="color: var(--primary); margin: 4px 0;">${c.sentencePy}</div>
                    <div style="color: var(--text-muted); line-height: 1.4;">${c.sentenceDe}</div>
                </div>
            `;
        }
        
        div.innerHTML = html;
        resultsContainer.appendChild(div);
    });
}

function toggleDictFocus(index) {
    let item = currentDictResults[index];
    if (!item.card.inFocus && getFocusCount() >= 150) {
        alert("Das Limit von 150 Vokabeln im Fokus ist erreicht.");
        return;
    }
    item.card.inFocus = !item.card.inFocus;
    if (item.card.inFocus) item.card.correctCount = 0;
    sessionQueue = [];
    updateUI(); searchDict(); 
}

function changeDictBox(index, newBoxLevel) {
    let item = currentDictResults[index];
    let oldBox = 'box' + item.boxNum;
    let newBox = 'box' + newBoxLevel;
    if (oldBox === newBox) return; 
    state[oldBox] = state[oldBox].filter(c => c !== item.card);
    item.card.lastMovedDate = new Date().toDateString();
    state[newBox].push(item.card);
    sessionQueue = [];
    updateUI(); searchDict(); 
}

function updateUI() {
    [1,2,3,4,5].forEach(i => {
        let countSpan = document.getElementById(`stat-count-${i}`);
        if (countSpan) countSpan.innerText = state['box'+i].length;
    });

    localStorage.setItem('hsk_data', JSON.stringify(state));
    highlightActiveBox(); 
    updateFocusButtonText();
}

function highlightActiveBox() {
    [1,2,3,4,5].forEach(i => {
        let element = document.getElementById(`stat-box-${i}`);
        if (element) {
            element.classList.remove('active-box', 'inactive-box', 'selected-box');
            if (selectedBoxFilter === i) {
                element.classList.add('selected-box');
            } else if (selectedBoxFilter !== null) {
                element.classList.add('inactive-box');
            } else if (currentBoxName === 'box' + i) {
                element.classList.add('active-box');
            } else if (currentBoxName !== "") {
                element.classList.add('inactive-box');
            }
        }
    });
}

function updateFocusButtonText() {
    let btn = document.getElementById('btn-toggle-only-focus');
    let count = getFocusCount();
    btn.innerText = `ALLE KARTEN (${count})`;
    if (onlyFocusMode) {
        btn.innerText = `FOKUS AKTIV (${count})`;
    }
}

function toggleOnlyFocusMode() {
    onlyFocusMode = !onlyFocusMode;
    sessionQueue = []; 
    let btn = document.getElementById('btn-toggle-only-focus');
    if (onlyFocusMode) {
        btn.style.background = "var(--focus-color)";
        btn.style.color = "#FFFFFF";
        btn.style.borderColor = "var(--focus-color)";
        selectedBoxFilter = null; 
        if(randomMode) toggleRandomMode();
    } else {
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        btn.style.borderColor = "var(--border-light)";
    }
    updateUI();

}

function toggleRandomMode() {
    randomMode = !randomMode;
    sessionQueue = []; 
    let btn = document.getElementById('btn-toggle-random-mode');
    if (randomMode) {
        btn.innerText = "ZUFALLSMODUS AKTIV";
        btn.style.background = "var(--box4)"; 
        btn.style.color = "#FFFFFF";
        btn.style.borderColor = "var(--box4)";
        selectedBoxFilter = null; 
        if(onlyFocusMode) toggleOnlyFocusMode();
    } else {
        btn.innerText = "ZUFALLSMODUS AUS";
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        btn.style.borderColor = "var(--border-light)";
    }
    updateUI();

}

function parseCSVLine(text) {
    let fields = []; let field = ""; let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"' || char === '„' || char === '“' || char === '”') { inQuotes = !inQuotes; } 
        else if (char === ',' && !inQuotes) { fields.push(cleanField(field)); field = ""; } 
        else { field += char; }
    }
    fields.push(cleanField(field)); return fields;
}

function cleanField(str) {
    let t = str.trim();
    if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith('„') && t.endsWith('“'))) { t = t.substring(1, t.length - 1); }
    return t.trim();
}

function importCSV(file) {
    if(!file) return;
    const targetBox = confirm("Vokabeln als bereits bekannt markieren (Box 5)?\nWählen Sie 'Abbrechen' für neue Vokabeln (Box 1).") ? 'box5' : 'box1';
    let detectedLevel = "Import";
    let match = file.name.toLowerCase().match(/hsk\s*([1-6])/);
    if (match) detectedLevel = "HSK " + match[1];
    
    const reader = new FileReader();
    reader.onload = (e) => {
        const rows = e.target.result.replace(/\r/g, "").split('\n');
        rows.forEach(r => {
            if(!r.trim()) return;
            const p = parseCSVLine(r);
            if(p.length >= 3) {
                state[targetBox].push({ 
                    hz: p[0], py: p[1], de: p[2], 
                    sentenceHz: p[3] || '', sentencePy: p[4] || '', sentenceDe: p[5] || '', 
                    level: p[6] ? p[6].trim() : detectedLevel, 
                    inFocus: false,
                    stats: { queries: 0, correct: 0 }
                });
            }
        });
        sessionQueue = [];
        updateUI(); next();
    };
    reader.readAsText(file);
}

function next() {
    if (dictMode) return; 

    if (sessionQueue.length === 0) {
        let pool = [];
        const boxWeights = [0, 16, 8, 4, 2, 1]; 
        
        for(let i=1; i<=5; i++) {
            if (selectedBoxFilter !== null && i !== selectedBoxFilter) continue;
            
            state['box'+i].forEach(c => {
                if (onlyFocusMode && !c.inFocus) return; 
                
                if (!c.stats) c.stats = { queries: 0, correct: 0 };

                let weight = 1; 
                if (!randomMode && selectedBoxFilter === null) {
                    if (i === 5) {
                        let rate = c.stats.queries > 0 ? (c.stats.correct / c.stats.queries) : 1; 
                        let rateWeight = Math.round((1 - rate) * 4); 
                        let freqWeight = c.stats.queries < 5 ? 2 : (c.stats.queries < 10 ? 1 : 0);
                        weight = 1 + rateWeight + freqWeight;
                    } else {
                        weight = boxWeights[i]; 
                    }
                }

                for(let j=0; j<weight; j++) {
                    pool.push({c, box: 'box'+i});
                }
                
                if (c.inFocus && !randomMode && selectedBoxFilter === null) {
                    let additionalTickets = 7;
                    for (let f = 0; f < additionalTickets; f++) pool.push({c, box: 'box'+i});
                }
            });
        }

        if(pool.length === 0) {
            currentBoxName = ""; currentCard = null;
            document.getElementById('v-box').innerText = "SYSTEMSTATUS";
            
            if (selectedBoxFilter !== null) {
                document.getElementById('v-de').innerText = `Box ${selectedBoxFilter} ist leer.`;
            } else {
                document.getElementById('v-de').innerText = onlyFocusMode ? "Keine Fokus-Karten vorhanden" : "Bitte laden Sie eine CSV-Datei...";
            }
            
            document.getElementById('v-char-count').innerText = "";
            document.getElementById('writer-container').classList.add('hidden');
            document.getElementById('drawing-controls').classList.add('hidden');
            document.getElementById('learning-tools').classList.add('hidden');
            document.getElementById('special-actions').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('v-stats').classList.add('hidden');
            highlightActiveBox();
            return;
        }

        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }

        sessionQueue = pool;
    }
    
    let selection = sessionQueue.pop();
    currentCard = selection.c; 
    currentBoxName = selection.box; 
    
    let statsInfo = "";
    if (currentBoxName === 'box5' && currentCard.stats && currentCard.stats.queries > 0) {
        let percent = Math.round((currentCard.stats.correct / currentCard.stats.queries) * 100);
        statsInfo = ` • ${percent}% ERFOLG`;
    }

    document.getElementById('v-box').innerText = (currentCard.level || "UNBEKANNT") + (currentCard.inFocus ? " • FOKUS" : "") + statsInfo;
    document.getElementById('v-de').innerText = currentCard.de;
    
    // Präzise Zählung der chinesischen Zeichen
    currentQuizChars = getHanziChars(currentCard.hz);
    let count = currentQuizChars.length;
    
    let countText = "";
    if (count === 1) countText = "(1 Zeichen)";
    else if (count === 2) countText = "(2 Zeichen)";
    else if (count === 3) countText = "(3 Zeichen)";
    else if (count > 3) countText = `(${count} Zeichen)`;
    
    document.getElementById('v-char-count').innerText = countText;

    highlightActiveBox();
    
    document.getElementById('writer-container').classList.remove('hidden');
    document.getElementById('writer-container').innerHTML = '';
    
    currentWriter = null; singleCharBox = null;
    document.getElementById('v-hz').classList.add('hidden');
    document.getElementById('v-hz').classList.remove('long-char');
    document.getElementById('v-py').classList.add('hidden');
    document.getElementById('v-stats').classList.add('hidden');
    
    document.getElementById('drawing-controls').classList.remove('hidden');
    document.getElementById('learning-tools').classList.add('hidden');
    document.getElementById('special-actions').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    closeModal();

    currentQuizCharIndex = 0;

    if (currentQuizChars.length > 0) {
        startQuizForCurrentChar();
    }
}

function flip() {
    if (!currentCard) return;
    
    let statsInfo = "";
    if (currentBoxName === 'box5' && currentCard.stats && currentCard.stats.queries > 0) {
        let percent = Math.round((currentCard.stats.correct / currentCard.stats.queries) * 100);
        statsInfo = ` • ${percent}% ERFOLG`;
    }

    document.getElementById('v-box').innerText = (currentCard.level || "UNBEKANNT") + (currentCard.inFocus ? " • FOKUS" : "") + statsInfo;

    // Zeichenanzahl-Hinweis beim Umdrehen wieder ausblenden
    document.getElementById('v-char-count').innerText = "";

    let hzElement = document.getElementById('v-hz');
    let cleanHz = currentCard.hz.replace(/\s/g, '');
    
    hzElement.classList.toggle('long-char', cleanHz.length > 3);
    hzElement.innerText = currentCard.hz;
    document.getElementById('v-py').innerText = currentCard.py;
    
    hzElement.classList.remove('hidden');
    document.getElementById('v-py').classList.remove('hidden');
    
    let statsElement = document.getElementById('v-stats');
    if (currentCard.stats && currentCard.stats.queries > 0) {
        let percent = Math.round((currentCard.stats.correct / currentCard.stats.queries) * 100);
        statsElement.innerHTML = `Abgefragt: <b>${currentCard.stats.queries}x</b> &nbsp;|&nbsp; Richtig: <b>${currentCard.stats.correct}x</b> (${percent}%)`;
    } else {
        statsElement.innerHTML = "<i>Noch keine Statistik vorhanden</i>";
    }
    statsElement.classList.remove('hidden');
    
    let btnExample = document.getElementById('btn-example-trigger');
    if (currentCard.sentenceHz) {
        document.getElementById('ex-hz').innerText = currentCard.sentenceHz;
        document.getElementById('ex-py').innerText = currentCard.sentencePy;
        document.getElementById('ex-de').innerText = currentCard.sentenceDe;
        btnExample.disabled = false;
    } else {
        btnExample.disabled = true;
    }
    
    let btnFocus = document.getElementById('btn-focus');
    if (currentCard.inFocus) {
        btnFocus.innerText = "FOKUS AKTIV";
        btnFocus.style.background = "var(--focus-color)";
        btnFocus.style.color = "#FFFFFF";
    } else {
        btnFocus.innerText = "FOKUS AKTIVIEREN";
        btnFocus.style.background = "var(--bg)";
        btnFocus.style.color = "var(--focus-color)";
    }
    
    document.getElementById('writer-container').classList.add('hidden');
    document.getElementById('drawing-controls').classList.add('hidden');
    
    document.getElementById('learning-tools').classList.remove('hidden');
    document.getElementById('special-actions').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
}

    const container = document.getElementById('writer-container');

}

function openModal() { document.getElementById('exampleModal').classList.remove('hidden'); }
function closeModal() { document.getElementById('exampleModal').classList.add('hidden'); }

function toggleFocus() {
    if (!currentCard) return;
    if (!currentCard.inFocus && getFocusCount() >= 150) { alert("Das Limit von 150 Vokabeln im Fokus ist erreicht."); return; }
    
    currentCard.inFocus = !currentCard.inFocus;
    if (currentCard.inFocus) currentCard.correctCount = 0;
    
    let btnFocus = document.getElementById('btn-focus');
    if (currentCard.inFocus) {
        btnFocus.innerText = "FOKUS AKTIV";
        btnFocus.style.background = "var(--focus-color)";
        btnFocus.style.color = "#FFFFFF";
    } else {
        btnFocus.innerText = "FOKUS AKTIVIEREN";
        btnFocus.style.background = "var(--bg)";
        btnFocus.style.color = "var(--focus-color)";
    }
    
    let statsInfo = "";
    if (currentBoxName === 'box5' && currentCard.stats && currentCard.stats.queries > 0) {
        let percent = Math.round((currentCard.stats.correct / currentCard.stats.queries) * 100);
        statsInfo = ` • ${percent}% ERFOLG`;
    }
    
    document.getElementById('v-box').innerText = (currentCard.level || "UNBEKANNT") + (currentCard.inFocus ? " • FOKUS" : "") + statsInfo;
    sessionQueue = [];
    updateUI();
}

function move(step) {
    if (!currentCard) return;
    
    if (!currentCard.stats) currentCard.stats = { queries: 0, correct: 0 };
    currentCard.stats.queries++;
    if (step === 1) {
        currentCard.stats.correct++;
    }

    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    let level = parseInt(oldBox.replace('box',''));
    state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    
    let today = new Date().toDateString(); let effectiveStep = step;
    if (currentCard.lastMovedDate === today) { effectiveStep = 0; } 
    else if (step !== 0) { currentCard.lastMovedDate = today; }

    if (effectiveStep === 1 && currentCard.inFocus) {
        if (!currentCard.correctCount) currentCard.correctCount = 0;
        currentCard.correctCount++;
        if (currentCard.correctCount >= 20) { currentCard.inFocus = false; currentCard.correctCount = 0; }
    }

    let newLevel = Math.min(Math.max(level + effectiveStep, 1), 5);
    state['box' + newLevel].push(currentCard);
    updateUI(); next();
}

function moveToBox5() {
    if (!currentCard) return;
    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    if (oldBox) state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    currentCard.lastMovedDate = new Date().toDateString();
    state['box5'].push(currentCard);
    updateUI(); next();
}

function resetSpeicher() { if(confirm("Möchten Sie den Lernstand wirklich vollständig löschen? Dieser Vorgang kann nicht rückgängig gemacht werden.")) { state = { box1: [], box2: [], box3: [], box4: [], box5: [] }; sessionQueue = []; updateUI(); location.reload(); } }
function exportProgress() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "hsk_trainer_backup.json"); dl.click(); }
function importProgress(file) { const reader = new FileReader(); reader.onload = (e) => { state = JSON.parse(e.target.result); sessionQueue = []; updateUI(); next(); }; reader.readAsText(file); }
function clearCanvas() { if (currentWriter) currentWriter.cancelQuiz(); currentQuizCharIndex = 0; startQuizForCurrentChar(); }
function speak() { if(!currentCard) return; const u = new SpeechSynthesisUtterance(currentCard.hz); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }

updateUI(); next();
