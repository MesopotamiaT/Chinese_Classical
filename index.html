<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HSK Trainer">
    <title>HSK Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        :root { 
            /* Moderne, professionelle Farbpalette */
            --bg: #f8fafc; /* Sehr helles, kühles Grau */
            --card: #ffffff; 
            --text-main: #0f172a; /* Tiefes Schiefergrau */
            --text-muted: #64748b;
            --primary: #2563eb; /* Kräftiges, seriöses Blau */
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            
            /* Box-Farben (sanfter & professioneller) */
            --box1: #ef4444; /* Rot */
            --box2: #f59e0b; /* Bernstein */
            --box3: #3b82f6; /* Blau */
            --box4: #8b5cf6; /* Violett */
            --box5: #10b981; /* Smaragdgrün */
            
            --dark-btn: #334155;
            --focus-color: #ea580c; /* Kräftiges Orange */
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; 
            background: var(--bg); 
            margin: 0; 
            padding: 2vh 15px; 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container { max-width: 540px; margin: auto; }
        
        /* Header & Navigation */
        .nav { 
            display: flex; 
            flex-direction: column;
            margin-bottom: 24px; 
            gap: 16px; 
        }
        .nav h2 { 
            margin: 0; 
            font-size: 1.75rem; 
            font-weight: 800; 
            letter-spacing: -0.025em; 
            color: var(--text-main); 
        }
        .nav-buttons { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
        }
        
        /* Statistik-Leiste */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin-bottom: 24px; 
            background: var(--card);
            padding: 8px;
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .stat-box { 
            padding: 10px 4px; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 0.75rem; 
            font-weight: 700; 
            transition: all 0.2s ease-in-out; 
            border: 2px solid transparent;
            color: var(--text-muted);
            background: var(--bg);
            cursor: default;
        }
        
        #stat-box-1 { color: var(--box1); }
        #stat-box-2 { color: var(--box2); }
        #stat-box-3 { color: var(--box3); }
        #stat-box-4 { color: var(--box4); }
        #stat-box-5 { color: var(--box5); }
        
        .stat-box.active-box { 
            border-color: currentColor; 
            background: var(--card);
            transform: scale(1.05);
            box-shadow: var(--shadow-sm);
        }
        .stat-box.inactive-box { 
            opacity: 0.5; 
        }

        /* Die Hauptkarte */
        .card { 
            background: var(--card); 
            padding: 32px 24px; 
            border-radius: 16px; 
            box-shadow: var(--shadow-md); 
            text-align: center; 
            border: 1px solid var(--border-light);
            transition: all 0.3s ease;
        }
        
        .hidden { display: none !important; }
        
        /* Buttons generell */
        button { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: none; 
            margin-top: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            font-size: 1rem; 
            font-family: inherit;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { filter: brightness(0.95); }
        button:active { transform: translateY(1px); filter: brightness(0.9); }
        
        /* Kleine Buttons in der Nav */
        .btn-small { 
            width: auto; 
            padding: 8px 12px; 
            font-size: 0.85rem; 
            border-radius: 8px; 
            margin-top: 0;
            flex: 1 1 auto;
            border: 1px solid var(--border-light);
        }
        
        /* Typografie in der Karte */
        #v-box { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            margin-bottom: 24px; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: inline-block;
            padding: 4px 12px;
            background: var(--bg);
            border-radius: 20px;
        }

        #v-de {
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--text-main); 
            word-break: break-word; 
            line-height: 1.4;
        }
        
        #v-hz {
            font-size: 6.5rem; 
            color: var(--text-main);
            font-weight: 500;
            margin: 20px 0;
            line-height: 1.1;
            word-break: break-all;
        }

        #v-hz.long-char {
            font-size: 4rem;
        }

        #v-py {
            font-size: 1.25rem; 
            color: var(--primary); 
            font-weight: 500; 
            margin-bottom: 20px;
            font-family: "Helvetica Neue", sans-serif;
            letter-spacing: 0.02em;
        }
        
        /* Schreibboxen */
        .writer-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin: 30px 0; }
        .char-box { 
            width: 80vw;
            height: 80vw;
            max-width: 280px; 
            max-height: 280px; 
            border: 2px dashed #cbd5e1; 
            border-radius: 12px; 
            background: #f8fafc; 
            transition: border-color 0.2s ease;
            position: relative;
        }
        .char-box:hover { border-color: var(--primary); }
        
        /* Modal */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(15, 23, 42, 0.5); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; padding: 20px; box-sizing: border-box; 
        }
        .modal-content { 
            background: var(--card); 
            padding: 32px; 
            border-radius: 16px; 
            max-width: 450px; 
            width: 100%; 
            max-height: 85vh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: var(--shadow-lg); 
            box-sizing: border-box; 
        }
        .modal-scroll-area { overflow-y: auto; flex-grow: 1; margin-bottom: 24px; }
        .modal-text { word-break: break-word; line-height: 1.6; margin-bottom: 16px; }
        
        /* Spezifische Action-Buttons (Controls unten) */
        #controls button {
            margin-top: 0;
            border-radius: 10px;
            font-size: 1.05rem;
            padding: 16px 12px;
            box-shadow: var(--shadow-sm);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <h2>HSK Trainer</h2>
        <div class="nav-buttons">
            <button id="btn-toggle-only-focus" class="btn-small" style="background: #fff; color: var(--focus-color); border-color: var(--focus-color);" onclick="toggleOnlyFocusMode()">🎯 Alle anzeigen (0)</button>
            <button id="btn-toggle-box5-mode" class="btn-small" style="background: #fff; color: var(--box5); border-color: var(--box5);" onclick="toggleBox5Mode()">⭐ Box 5 Aus</button>
            <button id="btn-toggle-dict" class="btn-small" style="background: #fff; color: var(--text-main);" onclick="toggleDictMode()">🔍 Wörterbuch</button>
            <input type="file" id="csvFile" class="hidden" onchange="importCSV(this.files[0])" accept=".csv">
            <button class="btn-small" style="background: var(--primary); color: white; border: none;" onclick="document.getElementById('csvFile').click()">+ CSV</button>
            <button class="btn-small" style="background: #ffffff; color: var(--text-main);" onclick="exportProgress()">💾 Backup</button>
            <input type="file" id="jsonFile" class="hidden" onchange="importProgress(this.files[0])" accept=".json">
            <button class="btn-small" style="background: #ffffff; color: var(--text-main);" onclick="document.getElementById('jsonFile').click()">📂 Laden</button>
            <button class="btn-small" style="background: #fef2f2; color: var(--box1); border-color: #fecaca;" onclick="resetSpeicher()">Löschen</button>
        </div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
        <!-- NEU: Wörterbuch View -->
        <div id="dict-view" class="hidden" style="text-align: left;">
            <input type="text" id="dict-search-input" placeholder="Nach Deutsch oder Pinyin suchen..." onkeypress="if(event.key === 'Enter') searchDict()" style="width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border-light); margin-bottom: 12px; box-sizing: border-box; font-size: 1rem; font-family: inherit;">
            <button onclick="searchDict()" style="background: var(--primary); color: white; margin-top: 0; margin-bottom: 24px;">Suchen</button>
            <div id="dict-results" style="max-height: 50vh; overflow-y: auto; padding-right: 4px;"></div>
        </div>

        <!-- Bestehende Karte -->
        <div id="v-box"></div>
        <div id="v-de">Bitte CSV laden...</div>
        <div id="v-hz" class="hidden"></div>
        <div id="v-py" class="hidden"></div>
        
        <button id="btn-example-trigger" class="hidden" style="background: var(--primary-light); color: var(--primary); font-size: 0.95rem;" onclick="openModal()">📖 Beispielsatz anzeigen</button>
        
        <div id="writer-container" class="writer-grid hidden"></div>
        
        <button id="btn-clear" class="btn-small hidden" style="background: var(--bg); color: var(--text-muted); margin: 0 auto 20px; display: block; max-width: 200px;" onclick="clearCanvas()">Neu versuchen</button>
        <button id="btn-show" class="hidden" style="background: var(--primary); color: white; box-shadow: var(--shadow-md);" onclick="flip()">Lösung anzeigen</button>
        <button id="btn-audio" class="hidden" style="background: var(--primary-light); color: var(--primary);" onclick="speak()">🔊 Aussprache anhören</button>
        <button id="btn-retry-writing" class="hidden" style="background: #fff; color: var(--primary); border: 2px solid var(--primary);" onclick="retryCurrentWordWriting()">✍️ Noch mal schreiben üben</button>
        
        <div id="special-actions" class="hidden" style="display: flex; gap: 12px; width: 100%; margin-top: 12px;">
            <button id="btn-focus" style="background: var(--focus-color); color: white; margin-top: 0;" onclick="toggleFocus()">🎯 Fokus</button>
            <button id="btn-to-box5" style="background: var(--dark-btn); color: white; margin-top: 0;" onclick="moveToBox5()">⭐ Box 5</button>
        </div>
        
        <div id="controls" class="hidden" style="display: flex; gap: 12px; width: 100%; margin-top: 24px;">
            <button style="background: var(--box1); color: white;" onclick="move(-1)">Falsch</button>
            <button style="background: var(--box2); color: white;" onclick="move(0)">Halten</button>
            <button style="background: var(--box5); color: white;" onclick="move(1)">Richtig</button>
        </div>
    </div>
</div>

<div id="exampleModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--text-main); font-weight: 700; border-bottom: 1px solid var(--border-light); padding-bottom: 16px; margin-bottom: 20px; flex-shrink: 0;">Beispielsatz</h3>
        
        <div class="modal-scroll-area">
            <div id="ex-hz" class="modal-text" style="font-size: 1.75rem; font-weight: 500; color: var(--text-main);"></div>
            <div id="ex-py" class="modal-text" style="color: var(--primary); font-size: 1.1rem; margin-top: -10px; font-weight: 500;"></div>
            <div id="ex-de" class="modal-text" style="color: var(--text-main); font-size: 1.05rem; background: var(--bg); padding: 16px; border-radius: 12px; border-left: 4px solid var(--primary); font-weight: 400; margin-top: 24px;"></div>
        </div>
        
        <button style="background: var(--bg); color: var(--text-main); margin-top: 0; padding: 14px; flex-shrink: 0; border: 1px solid var(--border-light);" onclick="closeModal()">Schließen</button>
    </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('hsk_data')) || { box1: [], box2: [], box3: [], box4: [], box5: [] };
let currentCard = null;
let currentBoxName = ""; 

// NEU: Globale Variablen für das einzelne Eingabefeld
let currentQuizChars = [];
let currentQuizCharIndex = 0;
let currentWriter = null;
let singleCharBox = null;

let onlyFocusMode = false; 
let box5Mode = false;       
let dictMode = false;       
let currentDictResults = []; 

// NEU: Funktion zur Abfrage eines Zeichens in der einzelnen Box
function startQuizForCurrentChar() {
    if (!singleCharBox || currentQuizCharIndex >= currentQuizChars.length) return;
    
    // Leere das Element für das neue Zeichen
    singleCharBox.innerHTML = ''; 
    
    let char = currentQuizChars[currentQuizCharIndex];
    let boxSize = Math.min(280, window.innerWidth * 0.8);
    
    currentWriter = HanziWriter.create(singleCharBox, char, { 
        width: boxSize, 
        height: boxSize, 
        showCharacter: false, 
        showOutline: false, 
        padding: Math.floor(boxSize * 0.04), 
        strokeColor: '#2563eb' 
    });
    
    currentWriter.quiz({
        onComplete: function() {
            // Eine kleine Verzögerung (400ms), damit man das geschriebene Zeichen noch kurz sieht,
            // bevor das Feld geleert wird und das nächste Zeichen abgefragt wird.
            setTimeout(() => {
                currentQuizCharIndex++;
                if (currentQuizCharIndex < currentQuizChars.length) {
                    startQuizForCurrentChar();
                }
            }, 400); 
        }
    });
}

function getFocusCount() {
    let count = 0;
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            if (c.inFocus) count++;
        });
    }
    return count;
}

function toggleDictMode() {
    dictMode = !dictMode;
    let btn = document.getElementById('btn-toggle-dict');
    let dictView = document.getElementById('dict-view');
    let flashcardElements = ['v-box', 'v-de', 'v-hz', 'v-py', 'writer-container', 'btn-example-trigger', 'btn-clear', 'btn-show', 'btn-audio', 'btn-retry-writing', 'special-actions', 'controls'];
    
    if (dictMode) {
        btn.style.background = "var(--primary)";
        btn.style.color = "white";
        dictView.classList.remove('hidden');
        
        flashcardElements.forEach(id => {
            let el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        });
        
        document.getElementById('dict-search-input').value = "";
        document.getElementById('dict-results').innerHTML = "";
        document.getElementById('dict-search-input').focus();
    } else {
        btn.style.background = "#fff";
        btn.style.color = "var(--text-main)";
        dictView.classList.add('hidden');
        
        document.getElementById('v-box').classList.remove('hidden');
        document.getElementById('v-de').classList.remove('hidden');
        
        next(); 
    }
}

function searchDict() {
    let query = document.getElementById('dict-search-input').value.trim().toLowerCase();
    let resultsContainer = document.getElementById('dict-results');
    resultsContainer.innerHTML = "";
    
    if (!query) return;

    let allCards = [];
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            allCards.push({ card: c, boxNum: i });
        });
    }

    currentDictResults = allCards.filter(item => 
        item.card.de.toLowerCase().includes(query) || 
        item.card.py.toLowerCase().includes(query) ||
        item.card.hz.includes(query)
    );

    if (currentDictResults.length === 0) {
        resultsContainer.innerHTML = "<p style='color: var(--text-muted); text-align: center;'>Keine Ergebnisse gefunden.</p>";
        return;
    }

    currentDictResults.forEach((item, index) => {
        let c = item.card;
        let boxNum = item.boxNum;
        let div = document.createElement('div');
        div.style.cssText = "background: var(--bg); padding: 16px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-light);";
        
        let focusBtnBg = c.inFocus ? "var(--focus-color)" : "var(--card)";
        let focusBtnColor = c.inFocus ? "white" : "var(--text-muted)";
        let focusBtnBorder = c.inFocus ? "var(--focus-color)" : "var(--border-light)";
        let focusText = c.inFocus ? "Fokus aktiv" : "Fokus";

        let html = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div style="font-size: 2rem; color: var(--text-main); font-weight: 500;">${c.hz}</div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <button onclick="toggleDictFocus(${index})" style="margin: 0; padding: 4px 10px; width: auto; font-size: 0.75rem; border-radius: 20px; background: ${focusBtnBg}; color: ${focusBtnColor}; border: 1px solid ${focusBtnBorder}; font-weight: bold; font-family: inherit;">🎯 ${focusText}</button>
                    <select onchange="changeDictBox(${index}, this.value)" style="background: var(--box${boxNum}); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; letter-spacing: 0.05em; text-transform: uppercase; border: none; cursor: pointer; outline: none;">
                        <option value="1" style="color: black; background: white;" ${boxNum == 1 ? 'selected' : ''}>Box 1</option>
                        <option value="2" style="color: black; background: white;" ${boxNum == 2 ? 'selected' : ''}>Box 2</option>
                        <option value="3" style="color: black; background: white;" ${boxNum == 3 ? 'selected' : ''}>Box 3</option>
                        <option value="4" style="color: black; background: white;" ${boxNum == 4 ? 'selected' : ''}>Box 4</option>
                        <option value="5" style="color: black; background: white;" ${boxNum == 5 ? 'selected' : ''}>Box 5</option>
                    </select>
                </div>
            </div>
            <div style="color: var(--primary); font-size: 1.1rem; margin-bottom: 8px;">${c.py}</div>
            <div style="font-size: 1.1rem; font-weight: 600; color: var(--text-main); margin-bottom: 4px;">${c.de}</div>
        `;
        
        if (c.sentenceHz) {
            html += `
                <div style="border-top: 1px solid var(--border-light); padding-top: 12px; margin-top: 12px;">
                    <div style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 4px;">${c.sentenceHz}</div>
                    <div style="color: var(--primary); font-size: 0.9rem; margin-bottom: 4px;">${c.sentencePy}</div>
                    <div style="color: var(--text-muted); font-size: 0.9rem;">${c.sentenceDe}</div>
                </div>
            `;
        }
        
        div.innerHTML = html;
        resultsContainer.appendChild(div);
    });
}

function toggleDictFocus(index) {
    let item = currentDictResults[index];
    
    if (!item.card.inFocus && getFocusCount() >= 150) {
        alert("Du kannst maximal 150 Vokabeln in den Fokus setzen!");
        return;
    }

    item.card.inFocus = !item.card.inFocus;
    if (item.card.inFocus) {
        item.card.correctCount = 0; 
    }
    updateUI(); 
    searchDict(); 
}

function changeDictBox(index, newBoxLevel) {
    let item = currentDictResults[index];
    let oldBox = 'box' + item.boxNum;
    let newBox = 'box' + newBoxLevel;
    
    if (oldBox === newBox) return; 

    state[oldBox] = state[oldBox].filter(c => c !== item.card);
    item.card.lastMovedDate = new Date().toDateString();
    state[newBox].push(item.card);
    
    updateUI(); 
    searchDict(); 
}

function updateUI() {
    document.getElementById('stats').innerHTML = [1,2,3,4,5].map(i => `<div id="stat-box-${i}" class="stat-box">B${i}<br>${state['box'+i].length}</div>`).join('');
    localStorage.setItem('hsk_data', JSON.stringify(state));
    highlightActiveBox(); 
    updateFocusButtonText();
}

function highlightActiveBox() {
    [1,2,3,4,5].forEach(i => {
        let element = document.getElementById(`stat-box-${i}`);
        if (element) {
            element.classList.remove('active-box', 'inactive-box');
            if (currentBoxName === 'box' + i) {
                element.classList.add('active-box');
            } else if (currentBoxName !== "") {
                element.classList.add('inactive-box');
            }
        }
    });
}

function updateFocusButtonText() {
    let focusCount = getFocusCount();
    let btn = document.getElementById('btn-toggle-only-focus');
    if (onlyFocusMode) {
        btn.innerText = "🎯 Nur Fokus (" + focusCount + ")";
    } else {
        btn.innerText = "🎯 Alle anzeigen (" + focusCount + ")";
    }
}

function toggleOnlyFocusMode() {
    onlyFocusMode = !onlyFocusMode;
    let btn = document.getElementById('btn-toggle-only-focus');
    if (onlyFocusMode) {
        btn.style.background = "var(--focus-color)";
        btn.style.color = "white";
        
        if(box5Mode) {
            toggleBox5Mode();
        }
    } else {
        btn.style.background = "#fff";
        btn.style.color = "var(--focus-color)";
    }
    updateFocusButtonText();
    next();
}

function toggleBox5Mode() {
    box5Mode = !box5Mode;
    let btn = document.getElementById('btn-toggle-box5-mode');
    if (box5Mode) {
        btn.innerText = "⭐ Nur Box 5";
        btn.style.background = "var(--box5)";
        btn.style.color = "white";
        
        if(onlyFocusMode) {
            toggleOnlyFocusMode();
        }
    } else {
        btn.innerText = "⭐ Box 5 Aus";
        btn.style.background = "#fff";
        btn.style.color = "var(--box5)";
    }
    next();
}

function parseCSVLine(text) {
    let fields = [];
    let field = "";
    let inQuotes = false;
    
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        
        if (char === '"' || char === '„' || char === '“' || char === '”') {
            inQuotes = !inQuotes; 
        } else if (char === ',' && !inQuotes) {
            fields.push(cleanField(field));
            field = "";
        } else {
            field += char;
        }
    }
    fields.push(cleanField(field));
    return fields;
}

function cleanField(str) {
    let t = str.trim();
    if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith('„') && t.endsWith('“'))) {
        t = t.substring(1, t.length - 1);
    }
    return t.trim();
}

function importCSV(file) {
    if(!file) return;
    const targetBox = confirm("Sollen die neuen Vokabeln direkt in Box 5 (bekannt) einsortiert werden?\nKlicke 'Abbrechen' für Box 1 (neu lernen).") ? 'box5' : 'box1';
    
    let detectedLevel = "Import";
    let match = file.name.toLowerCase().match(/hsk\s*([1-6])/);
    if (match) {
        detectedLevel = "HSK " + match[1];
    }
    
    const reader = new FileReader();
    reader.onload = (e) => {
        const rows = e.target.result.replace(/\r/g, "").split('\n');
        rows.forEach(r => {
            if(!r.trim()) return;
            
            const p = parseCSVLine(r);
            
            if(p.length >= 3) {
                state[targetBox].push({
                    hz: p[0], 
                    py: p[1], 
                    de: p[2], 
                    sentenceHz: p[3] || '', 
                    sentencePy: p[4] || '', 
                    sentenceDe: p[5] || '',
                    level: p[6] ? p[6].trim() : detectedLevel,
                    inFocus: false
                });
            }
        });
        updateUI(); next();
    };
    reader.readAsText(file);
}

function next() {
    if (dictMode) return; 

    let pool = [];
    const boxWeights = [0, 16, 8, 4, 2, 1]; 
    
    for(let i=1; i<=5; i++) {
        for(let j=0; j<boxWeights[i]; j++) {
            state['box'+i].forEach(c => {
                if (box5Mode && i !== 5) return;
                if (onlyFocusMode && !c.inFocus) return; 

                pool.push({c, box: 'box'+i});
                
                if (c.inFocus) {
                    let additionalTickets = box5Mode ? 2 : 7;
                    for (let f = 0; f < additionalTickets; f++) {
                        pool.push({c, box: 'box'+i});
                    }
                }
            });
        }
    }
    
    if(pool.length === 0) {
        currentBoxName = "";
        currentCard = null;
        if (onlyFocusMode) {
            document.getElementById('v-box').innerText = "FILTER AKTIV";
            document.getElementById('v-de').innerText = "Keine Fokus-Karten vorhanden!";
        } else if (box5Mode) {
            document.getElementById('v-box').innerText = "FILTER AKTIV";
            document.getElementById('v-de').innerText = "Keine Vokabeln in Box 5 vorhanden!";
        } else {
            document.getElementById('v-box').innerText = "LEER";
            document.getElementById('v-de').innerText = "Bitte CSV laden...";
        }
        document.getElementById('writer-container').classList.add('hidden');
        document.getElementById('btn-show').classList.add('hidden');
        document.getElementById('btn-clear').classList.add('hidden');
        document.getElementById('btn-retry-writing').classList.add('hidden');
        return;
    }
    
    let selection = pool[Math.floor(Math.random() * pool.length)];
    currentCard = selection.c;
    currentBoxName = selection.box; 
    
    let cardLevel = currentCard.level || "Unbekannt";
    let focusTag = currentCard.inFocus ? " [FOKUS]" : "";
    document.getElementById('v-box').innerText = "Stufe: " + cardLevel + focusTag;
    document.getElementById('v-de').innerText = currentCard.de;
    
    highlightActiveBox();
    
    // UI Reset für das Zeichnen
    document.getElementById('writer-container').classList.remove('hidden');
    document.getElementById('writer-container').innerHTML = '';
    
    currentWriter = null; 
    singleCharBox = null;
    currentQuizChars = [];
    
    document.getElementById('v-hz').classList.add('hidden');
    document.getElementById('v-hz').classList.remove('long-char');
    document.getElementById('v-py').classList.add('hidden');
    document.getElementById('btn-example-trigger').classList.add('hidden');
    document.getElementById('special-actions').classList.add('hidden');
    document.getElementById('btn-show').classList.remove('hidden');
    document.getElementById('btn-clear').classList.remove('hidden');
    document.getElementById('btn-audio').classList.add('hidden');
    document.getElementById('btn-retry-writing').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    closeModal();

    let cleanHz = currentCard.hz.replace(/\s/g, '');
    currentQuizChars = cleanHz.split('').filter(char => /[\u4e00-\u9fa5]/.test(char));
    currentQuizCharIndex = 0;

    // Nur ein Element erstellen, das dann nacheinander befüllt wird
    if (currentQuizChars.length > 0) {
        singleCharBox = document.createElement('div'); 
        singleCharBox.className = 'char-box';
        document.getElementById('writer-container').appendChild(singleCharBox);
        
        startQuizForCurrentChar();
    }
}

function flip() {
    if (!currentCard) return;
    let cardLevel = currentCard.level || "Unbekannt";
    let focusTag = currentCard.inFocus ? " [FOKUS]" : "";
    document.getElementById('v-box').innerText = "Stufe: " + cardLevel + focusTag;

    let hzElement = document.getElementById('v-hz');
    let cleanHz = currentCard.hz.replace(/\s/g, '');
    
    if (cleanHz.length > 3) {
        hzElement.classList.add('long-char');
    } else {
        hzElement.classList.remove('long-char');
    }

    hzElement.innerText = currentCard.hz;
    document.getElementById('v-py').innerText = currentCard.py;
    hzElement.classList.remove('hidden');
    document.getElementById('v-py').classList.remove('hidden');
    
    if (currentCard.sentenceHz) {
        document.getElementById('ex-hz').innerText = currentCard.sentenceHz;
        document.getElementById('ex-py').innerText = currentCard.sentencePy;
        document.getElementById('ex-de').innerText = currentCard.sentenceDe;
        document.getElementById('btn-example-trigger').classList.remove('hidden');
    }
    
    document.getElementById('btn-focus').innerText = currentCard.inFocus ? "🎯 Fokus aktiv" : "🎯 Fokus";
    
    document.getElementById('writer-container').classList.add('hidden');
    document.getElementById('btn-show').classList.add('hidden');
    document.getElementById('btn-clear').classList.add('hidden');
    document.getElementById('btn-audio').classList.remove('hidden');
    document.getElementById('btn-retry-writing').classList.remove('hidden');
    document.getElementById('special-actions').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
}

function retryCurrentWordWriting() {
    if (!currentCard) return;
    
    document.getElementById('v-hz').classList.add('hidden');
    document.getElementById('v-py').classList.add('hidden');
    document.getElementById('btn-example-trigger').classList.add('hidden');
    document.getElementById('btn-show').classList.remove('hidden');
    document.getElementById('btn-clear').classList.remove('hidden');
    
    const container = document.getElementById('writer-container');
    container.innerHTML = '';
    container.classList.remove('hidden');
    
    currentWriter = null;
    singleCharBox = null;
    currentQuizChars = [];
    
    let cleanHz = currentCard.hz.replace(/\s/g, '');
    currentQuizChars = cleanHz.split('').filter(char => /[\u4e00-\u9fa5]/.test(char));
    currentQuizCharIndex = 0;

    if (currentQuizChars.length > 0) {
        singleCharBox = document.createElement('div'); 
        singleCharBox.className = 'char-box';
        container.appendChild(singleCharBox);
        
        startQuizForCurrentChar();
    }
}

function openModal() { document.getElementById('exampleModal').classList.remove('hidden'); }
function closeModal() { document.getElementById('exampleModal').classList.add('hidden'); }

function toggleFocus() {
    if (!currentCard) return;

    if (!currentCard.inFocus && getFocusCount() >= 150) {
        alert("Du kannst maximal 150 Vokabeln in den Fokus setzen!");
        return;
    }

    currentCard.inFocus = !currentCard.inFocus;
    if (currentCard.inFocus) {
        currentCard.correctCount = 0;
    }
    document.getElementById('btn-focus').innerText = currentCard.inFocus ? "🎯 Fokus aktiv" : "🎯 Fokus";
    let cardLevel = currentCard.level || "Unbekannt";
    let focusTag = currentCard.inFocus ? " [FOKUS]" : "";
    document.getElementById('v-box').innerText = "Stufe: " + cardLevel + focusTag;
    updateUI();
}

function move(step) {
    if (!currentCard) return;
    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    let level = parseInt(oldBox.replace('box',''));
    
    state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    
    let today = new Date().toDateString();
    let effectiveStep = step;
    
    if (currentCard.lastMovedDate === today) {
        effectiveStep = 0; 
    } else if (step !== 0) {
        currentCard.lastMovedDate = today;
    }

    if (effectiveStep === 1 && currentCard.inFocus) {
        if (!currentCard.correctCount) {
            currentCard.correctCount = 0;
        }
        currentCard.correctCount++;
        if (currentCard.correctCount >= 20) {
            currentCard.inFocus = false;
            currentCard.correctCount = 0; 
        }
    }

    let newLevel = Math.min(Math.max(level + effectiveStep, 1), 5);
    state['box' + newLevel].push(currentCard);
    
    updateUI(); next();
}

function moveToBox5() {
    if (!currentCard) return;
    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    if (oldBox) {
        state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    }
    
    currentCard.lastMovedDate = new Date().toDateString();
    state['box5'].push(currentCard);
    updateUI(); next();
}

function resetSpeicher() { if(confirm("Alles löschen?")) { state = { box1: [], box2: [], box3: [], box4: [], box5: [] }; updateUI(); location.reload(); } }
function exportProgress() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "hsk_backup.json"); dl.click(); }
function importProgress(file) { const reader = new FileReader(); reader.onload = (e) => { state = JSON.parse(e.target.result); updateUI(); next(); }; reader.readAsText(file); }

// NEU: Clear-Funktion bricht das Quiz ab und startet beim allerersten Zeichen (Index 0) im selben Feld
function clearCanvas() { 
    if (currentWriter) {
        currentWriter.cancelQuiz();
    }
    currentQuizCharIndex = 0;
    startQuizForCurrentChar();
}

function speak() { if(!currentCard) return; const u = new SpeechSynthesisUtterance(currentCard.hz); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }

updateUI(); next();
</script>
