<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HSK Trainer">
    <meta name="theme-color" content="#f4f6f9">

    <title>HSK Trainer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,500;1,8..60,600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>

    <style>
        :root {
            --bg: #f3f6fa;
            --card: #ffffff;
            --surface: #f8fafc;
            --surface-2: #f1f5f9;

            --text-main: #15171c;
            --text-muted: #667085;
            --text-soft: #98a2b3;

            --border: #e7eaf0;
            --border-strong: #d8dde6;

            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-soft: #eaf1ff;

            --focus-color: #7c3aed;
            --focus-soft: #f2eafe;

            --box1: #e5484d;
            --box2: #14a6a6;
            --box3: #5b6ee1;
            --box4: #e99a14;
            --box5: #3b82f6;
            --box6: #8b5cf6;
            --box7: #27a65a;
            --box8: #df3f7d;

            --shadow-small:
                0 1px 2px rgba(16, 24, 40, 0.04),
                0 3px 8px rgba(16, 24, 40, 0.05);

            --shadow-medium:
                0 8px 24px rgba(16, 24, 40, 0.08),
                0 2px 8px rgba(16, 24, 40, 0.04);

            --shadow-card:
                0 20px 48px rgba(16, 24, 40, 0.09),
                0 4px 16px rgba(16, 24, 40, 0.05);

            --radius-small: 10px;
            --radius-button: 13px;
            --radius-card: 24px;

            --font-ui:
                'Manrope',
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            --font-read:
                'Source Serif 4',
                Georgia,
                'Songti SC',
                'STSong',
                serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0d0f14;
                --card: #16191f;
                --surface: #1c2027;
                --surface-2: #222731;

                --text-main: #f2f4f7;
                --text-muted: #a7b0bf;
                --text-soft: #778292;

                --border: #292e38;
                --border-strong: #363d49;

                --primary: #6da4ff;
                --primary-dark: #4e8ef7;
                --primary-soft: #192b4b;

                --focus-color: #ae8aff;
                --focus-soft: #291f3c;

                --box1: #f06166;
                --box2: #35c4c4;
                --box3: #8190ff;
                --box4: #f0aa34;
                --box5: #64a2ff;
                --box6: #a68bfa;
                --box7: #46bd74;
                --box8: #ee6a9c;

                --shadow-small:
                    0 2px 7px rgba(0,0,0,0.22);

                --shadow-medium:
                    0 10px 28px rgba(0,0,0,0.30);

                --shadow-card:
                    0 22px 50px rgba(0,0,0,0.38),
                    0 4px 14px rgba(0,0,0,0.22);
            }
        }

        html {
            font-size: 17px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;

            font-family: var(--font-ui);
            background: var(--bg);
            color: var(--text-main);

            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            background:
                radial-gradient(
                    circle at 10% -10%,
                    rgba(37, 99, 235, 0.10),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 110% 15%,
                    rgba(124, 58, 237, 0.07),
                    transparent 30%
                ),
                var(--bg);
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        button {
            border: 0;
            outline: 0;
            cursor: pointer;
            font-weight: 800;

            display: flex;
            justify-content: center;
            align-items: center;

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease,
                filter 0.12s ease,
                background-color 0.12s ease;

            -webkit-tap-highlight-color: transparent;
        }

        button:active {
            transform: scale(0.975);
        }

        button:disabled {
            opacity: 0.38;
            cursor: not-allowed;
            transform: none !important;
        }

        .hidden {
            display: none !important;
        }

        .container {
            width: 100%;
            max-width: 560px;

            height: 100vh;
            height: 100dvh;

            margin: 0 auto;

            display: flex;
            flex-direction: column;

            padding:
                max(12px, env(safe-area-inset-top))
                max(12px, env(safe-area-inset-right))
                max(12px, env(safe-area-inset-bottom))
                max(12px, env(safe-area-inset-left));

            overflow: hidden;
        }

        .header {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .header-top {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .header-top h2 {
            margin: 0 2px;
            font-size: 1.48rem;
            line-height: 1.1;
            font-weight: 800;
            letter-spacing: -0.045em;
        }

        .system-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
        }

        .system-buttons button {
            min-width: 0;
            min-height: 46px;

            padding: 8px 3px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--card);
            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.76rem;
            font-weight: 800;

            letter-spacing: -0.012em;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .system-buttons .btn-action {
            background:
                linear-gradient(
                    145deg,
                    var(--primary),
                    var(--primary-dark)
                );

            border-color: transparent;
            color: white;

            box-shadow:
                0 7px 16px rgba(37,99,235,0.20);
        }

        .system-buttons .btn-stats {
            color: var(--box8);
        }

        .system-buttons .btn-danger {
            color: var(--box1);
        }

        .filter-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .filter-buttons button {
            min-width: 0;
            min-height: 45px;

            padding: 8px 5px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--card);
            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.78rem;
            font-weight: 800;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #box6-daily-progress {
            position: relative;

            min-height: 42px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 9px 14px 9px 42px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--card);
            color: var(--box8);

            box-shadow: var(--shadow-small);

            font-size: 0.78rem;
            font-weight: 800;

            letter-spacing: 0.045em;
        }

        #box6-daily-progress::before {
            content: "6";

            position: absolute;
            left: 12px;
            top: 50%;

            transform: translateY(-50%);

            width: 23px;
            height: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--box8);
            color: white;

            font-size: 0.70rem;
            font-weight: 800;

            box-shadow:
                0 4px 10px rgba(223,63,125,0.24);
        }

        .stats {
            flex-shrink: 0;

            display: grid;
            grid-template-columns: repeat(8, 1fr);

            gap: 6px;
            padding: 7px;
            margin-bottom: 10px;

            border: 1px solid var(--border);
            border-radius: 16px;

            background: var(--card);
            box-shadow: var(--shadow-small);
        }

        .stat-box {
            position: relative;

            min-width: 0;
            min-height: 50px;

            padding: 7px 1px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border: 1px solid transparent;
            border-radius: 10px;

            background: transparent;
            color: var(--text-muted);

            font-size: 0.67rem;
            font-weight: 700;

            line-height: 1.2;
            cursor: pointer;

            user-select: none;

            transition:
                transform 0.12s ease,
                opacity 0.12s ease,
                background 0.12s ease,
                border-color 0.12s ease;
        }

        .stat-box span {
            margin-top: 2px;
            font-size: 0.92rem;
            font-weight: 800;
        }

        #stat-box-1 { color: var(--box1); }
        #stat-box-2 { color: var(--box2); }
        #stat-box-3 { color: var(--box3); }
        #stat-box-4 { color: var(--box4); }
        #stat-box-5 { color: var(--box5); }
        #stat-box-6 { color: var(--box6); }
        #stat-box-7 { color: var(--box7); }
        #stat-box-8 { color: var(--box8); }

        .stat-box.active-box {
            border-color: var(--border);
            background: var(--surface);
        }

        .stat-box.selected-box {
            border-color: currentColor;
            background: var(--surface);
            transform: translateY(-1px);
            box-shadow: var(--shadow-small);
        }

        .stat-box.inactive-box {
            opacity: 0.32;
        }

        .daily-badge {
            position: absolute;

            top: -5px;
            right: -4px;

            min-width: 18px;
            height: 18px;

            padding: 0 4px;

            display: flex;
            justify-content: center;
            align-items: center;

            border: 2px solid var(--card);
            border-radius: 999px;

            background: var(--focus-color);
            color: white;

            font-size: 0.57rem;
            font-weight: 800;

            box-shadow:
                0 3px 7px rgba(16,24,40,0.18);

            pointer-events: none;
        }

        .card {
            position: relative;
            min-height: 0;
            flex-grow: 1;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            padding: 17px 18px 15px;

            border: 1px solid var(--border);
            border-radius: var(--radius-card);

            background: var(--card);

            box-shadow: var(--shadow-card);
        }

        .card-content {
            position: relative;
            z-index: 1;

            min-height: 0;
            flex-grow: 1;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 11px;

            text-align: center;
        }

        #v-box {
            max-width: 100%;

            padding: 7px 13px;

            border: 1px solid var(--border);
            border-radius: 999px;

            background: var(--surface);
            color: var(--text-muted);

            font-size: 0.76rem;
            font-weight: 800;

            letter-spacing: 0.06em;

            text-transform: uppercase;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #v-de {
            width: min(100%, 460px);

            margin: 0;

            font-family: var(--font-read);

            font-size:
                clamp(
                    1.72rem,
                    5.8vw,
                    2.15rem
                );

            font-weight: 600;
            line-height: 1.25;
            letter-spacing: -0.012em;

            color: var(--text-main);
            word-break: break-word;
        }

        .char-tag {
            display: block;

            width: fit-content;

            margin: 9px auto 0;
            padding: 5px 10px;

            border-radius: 999px;

            background: var(--primary-soft);
            color: var(--primary);

            font-family: var(--font-ui);
            font-size: 0.79rem;
            font-weight: 700;
        }

        #v-hz {
            margin: 2px 0 0;

            font-size:
                clamp(
                    6.3rem,
                    25vw,
                    8.8rem
                );

            font-family:
                "Noto Sans SC",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-weight: 500;
            font-style: normal;

            line-height: 1.05;
            letter-spacing: 0;

            color: var(--text-main);

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        #v-hz.long-char {
            font-size:
                clamp(
                    3.8rem,
                    15.5vw,
                    5.7rem
                );

            font-family:
                "Noto Sans SC",
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-weight: 500;
            letter-spacing: 0;
            line-height: 1.1;
        }

        #v-py {
            margin: 0;

            font-family: var(--font-read);

            font-size:
                clamp(
                    1.4rem,
                    5.2vw,
                    1.75rem
                );

            font-style: italic;
            font-weight: 600;

            color: var(--primary);
        }

        #v-stats {
            max-width: 100%;

            margin-top: 2px;
            padding: 8px 13px;

            border: 1px solid var(--border);
            border-radius: 11px;

            background: var(--surface);
            color: var(--text-muted);

            font-size: 0.84rem;
            line-height: 1.5;
        }

        .writer-grid {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 0;
        }

        .char-box {
            position: relative;

            width: min(100%, 390px);
            max-width: 390px;
            max-height: 390px;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border: 1px solid var(--border-strong);
            border-radius: 21px;

            background-color: var(--surface);

            background-image:
                linear-gradient(
                    to right,
                    transparent 49.75%,
                    var(--border) 49.75%,
                    var(--border) 50.25%,
                    transparent 50.25%
                ),
                linear-gradient(
                    to bottom,
                    transparent 49.75%,
                    var(--border) 49.75%,
                    var(--border) 50.25%,
                    transparent 50.25%
                );

            box-shadow:
                inset 0 1px 4px rgba(16,24,40,0.03);

            touch-action: none;
        }

        .char-box:active {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }

        .action-area {
            position: relative;
            z-index: 1;

            flex-shrink: 0;
            margin-top: auto;

            padding-top: 13px;

            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .row-2 {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 8px;
        }

        .row-3 {
            width: 100%;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 8px;
        }

        .btn-large {
            min-height: 52px;

            padding: 13px 12px;

            border-radius: var(--radius-button);

            font-size: 0.99rem;
            font-weight: 800;

            letter-spacing: 0.03em;

            text-transform: uppercase;
        }

        .btn-medium {
            min-height: 47px;

            padding: 11px 8px;

            border-radius: var(--radius-button);

            font-size: 0.92rem;
            font-weight: 800;
        }

        .btn-primary {
            background:
                linear-gradient(
                    145deg,
                    var(--primary),
                    var(--primary-dark)
                );

            color: white;

            box-shadow:
                0 7px 16px rgba(37,99,235,0.20);
        }

        .btn-secondary {
            border: 1px solid var(--border);

            background: var(--surface);
            color: var(--text-main);

            box-shadow: var(--shadow-small);
        }

        .btn-tool {
            min-height: 49px;

            padding: 10px 4px;

            border: 1px solid var(--border);
            border-radius: var(--radius-button);

            background: var(--surface);
            color: var(--text-main);

            box-shadow: var(--shadow-small);

            font-size: 0.86rem;
            font-weight: 800;

            letter-spacing: 0.035em;

            text-transform: uppercase;
        }

        .btn-grade {
            min-height: 53px;

            padding: 12px 3px;

            border-radius: var(--radius-button);

            color: white;

            font-size: 0.89rem;
            font-weight: 800;

            letter-spacing: 0.03em;

            text-transform: uppercase;

            box-shadow:
                0 7px 15px rgba(16,24,40,0.11);
        }

        #dict-view {
            position: relative;
            z-index: 1;
            min-height: 0;
        }

        #dict-search-input {
            width: 100%;
            min-height: 49px;

            padding: 11px 13px;

            outline: none;

            border: 1px solid var(--border-strong);
            border-radius: var(--radius-button);

            background: var(--surface);
            color: var(--text-main);

            font-size: 1rem;
        }

        #dict-search-input::placeholder {
            color: var(--text-soft);
        }

        #dict-search-input:focus {
            border-color: var(--primary);

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                max(18px, env(safe-area-inset-top))
                18px
                max(18px, env(safe-area-inset-bottom));

            background:
                rgba(5,8,13,0.63);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .modal-content {
            width: 100%;
            max-width: 420px;
            max-height: 82vh;

            padding: 21px;

            display: flex;
            flex-direction: column;

            border: 1px solid var(--border);
            border-radius: 23px;

            background: var(--card);

            box-shadow:
                0 28px 70px rgba(0,0,0,0.30);

            font-size: 1rem;
        }

        #box6-stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.87rem;
        }

        #box6-stats-table th {
            position: sticky;
            top: 0;
            z-index: 1;

            padding: 9px 6px;

            border-bottom:
                1px solid var(--border-strong);

            background: var(--card);
            color: var(--text-muted);

            font-size: 0.67rem;

            text-transform: uppercase;
            letter-spacing: 0.025em;

            text-align: left;
            cursor: pointer;

            user-select: none;
            white-space: nowrap;
        }

        #box6-stats-table th:nth-child(n+2) {
            text-align: center;
        }

        #box6-stats-table td {
            padding: 10px 6px;

            border-bottom: 1px solid var(--border);

            vertical-align: middle;
        }

        #box6-stats-table td:nth-child(n+2) {
            text-align: center;
        }

        #box6-stats-table th.sorted-asc::after {
            content: " ▲";
            color: var(--primary);
        }

        #box6-stats-table th.sorted-desc::after {
            content: " ▼";
            color: var(--primary);
        }

        #box6-stats-summary {
            margin-bottom: 10px;
            padding: 8px 10px;

            border-radius: 10px;

            background: var(--surface);
            color: var(--text-muted);

            font-size: 0.81rem;
            text-align: center;
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: none;

            box-shadow:
                0 0 0 3px var(--primary-soft);
        }

        * {
            scrollbar-width: thin;
            scrollbar-color: var(--border-strong) transparent;
        }

        *::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        *::-webkit-scrollbar-track {
            background: transparent;
        }

        *::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: var(--border-strong);
        }

        @media (max-width: 390px) {
            html {
                font-size: 16.5px;
            }

            .container {
                padding-left: 9px;
                padding-right: 9px;
            }

            .header {
                gap: 6px;
                margin-bottom: 8px;
            }

            .header-top {
                gap: 7px;
            }

            .header-top h2 {
                font-size: 1.28rem;
            }

            .system-buttons,
            .filter-buttons,
            .stats,
            .row-2,
            .row-3 {
                gap: 5px;
            }

            .system-buttons button {
                min-height: 42px;
                padding: 6px 2px;
                font-size: 0.67rem;
            }

            .filter-buttons button {
                min-height: 41px;
                font-size: 0.70rem;
            }

            #box6-daily-progress {
                min-height: 38px;
                font-size: 0.71rem;
            }

            .stats {
                padding: 5px;
                margin-bottom: 8px;
            }

            .stat-box {
                min-height: 45px;
                font-size: 0.60rem;
            }

            .stat-box span {
                font-size: 0.80rem;
            }

            .card {
                padding:
                    14px
                    13px
                    12px;

                border-radius: 21px;
            }

            .card-content {
                gap: 8px;
            }

            #v-box {
                font-size: 0.69rem;
            }

            #v-de {
                font-size:
                    clamp(
                        1.55rem,
                        6.1vw,
                        1.88rem
                    );
            }

            #v-hz {
                font-size:
                    clamp(
                        5.5rem,
                        24vw,
                        7.3rem
                    );

                font-weight: 500;
            }

            #v-hz.long-char {
                font-size:
                    clamp(
                        3.25rem,
                        14.5vw,
                        4.7rem
                    );

                font-weight: 500;
            }

            #v-py {
                font-size:
                    clamp(
                        1.28rem,
                        5.3vw,
                        1.55rem
                    );
            }

                        <th onclick="sortBox6Stats('rate')">Quote</th>
                        <th onclick="sortBox6Stats('dueDays')">Fällig</th>
                    </tr>

<script>

let state =
    JSON.parse(
        localStorage.getItem('hsk_data')
    ) || {
        box1: [],
        box2: [],
        box3: [],
        box4: [],
        box5: [],
        box6: [],
        box7: [],
        box8: [],
        boxLayoutVersion: 2
    };


function migrateBoxLayout() {

    if (
        state.boxLayoutVersion === 2
    ) {

        for (
            let i = 1;
            i <= 8;
            i++
        ) {

            if (
                !Array.isArray(
                    state['box' + i]
                )
            ) {
                state[
                    'box' + i
                ] = [];
            }
        }

        return;
    }


    /*
     * Neue Reihenfolge:
     * alte Box 1 -> neue Box 1
     * bisherige zusätzliche Box 7 -> neue Box 2
     * bisherige zusätzliche Box 8 -> neue Box 3
     * alte Box 2 -> neue Box 4
     * alte Box 3 -> neue Box 5
     * alte Box 4 -> neue Box 8
     * alte Box 5 -> neue Box 7
     * alte Box 8 -> neue Box 8
     */
    let oldBoxes = {};

    for (
        let i = 1;
        i <= 8;
        i++
    ) {

        oldBoxes[i] =
            Array.isArray(
                state['box' + i]
            )
            ?
            state['box' + i]
            :
            [];
    }


    state.box1 = oldBoxes[1];
    state.box2 = oldBoxes[7];
    state.box3 = oldBoxes[8];
    state.box4 = oldBoxes[2];
    state.box5 = oldBoxes[3];
    state.box6 = oldBoxes[4];
    state.box7 = oldBoxes[5];
    state.box8 = oldBoxes[6];

    state.boxLayoutVersion =
        2;
}


migrateBoxLayout();


function ensureBox6Sections() {

    state.box8.forEach(c => {

        if (
            c.box6Section !== 'new'
            &&
            c.box6Section !== 'old'
        ) {

            /*
             * Die ursprüngliche Box 8 ist jetzt Box 8.
             * Bestehende Karten ohne Kennzeichnung gelten als "Old".
             */
            c.box6Section = 'old';
        }
    });
}

ensureBox6Sections();

if (!state.box6Daily) {
    state.box6Daily = {
        date: new Date().toDateString(),
        newCount: 0,
        oldCount: 0
    };
} else if (
    typeof state.box6Daily.newCount !== 'number'
    ||
    typeof state.box6Daily.oldCount !== 'number'
) {
    state.box6Daily = {
        date: state.box6Daily.date || new Date().toDateString(),
        newCount: 0,
        oldCount: 0
    };
}

let sessionQueue = [];
let currentCard = null;
let currentBoxName = "";

let currentQuizChars = [];
let currentQuizCharIndex = 0;
let currentWriter = null;
let singleCharBox = null;

let randomMode = false;
let selectedBoxFilter = null;
let selectedBox6Section = null;
let dictMode = false;
let currentDictResults = [];

let box6SortColumn = 'queries';
let box6SortDirection = 'desc';


document.getElementById('stats').innerHTML =
    [1,2,3,4,5,6,7,8]
        .map(i =>

            `
            <div
                id="stat-box-${i}"
                class="stat-box"
                onclick="handleStatBoxClick(${i})"
            >

                BOX ${i}

                <br>

                <span id="stat-count-${i}">
                    0
                </span>

                ${
                    (i >= 4 && i <= 7)
                    ?
                    `
                    <div
                        id="daily-count-${i}"
                        class="daily-badge"
                    >
                        0
                    </div>
                    `
                    :
                    ''
                }

            </div>
            `
        )
        .join('');


function handleStatBoxClick(i) {

    if (dictMode) {
        toggleDictMode();
    }

    sessionQueue = [];

    if (i === 8) {

        openBox6SectionModal();
        return;
    }

    selectedBox6Section = null;

    if (selectedBoxFilter === i) {
        selectedBoxFilter = null;
    } else {
        selectedBoxFilter = i;

        if (randomMode) {
            toggleRandomMode();
        }
    }

    updateUI();
    next();
}


function getBox6SectionCount(section) {

    ensureBox6Sections();

    return state.box8.filter(
        c => c.box6Section === section
    ).length;
}


function openBox6SectionModal() {

    ensureBox6Sections();

    let newCount =
        getBox6SectionCount('new');

    let oldCount =
        getBox6SectionCount('old');

    document
        .getElementById(
            'btn-box6-new'
        )
        .innerText =
            `BOX 8 NEW (${newCount})`;

    document
        .getElementById(
            'btn-box6-old'
        )
        .innerText =
            `BOX 8 OLD (${oldCount})`;

    let modal =
        document.getElementById(
            'box6SectionModal'
        );

    if (!modal) {
        return;
    }

    modal.classList.remove(
        'hidden'
    );

    modal.style.display =
        'flex';
}


function closeBox6SectionModal() {

    let modal =
        document.getElementById(
            'box6SectionModal'
        );

    if (!modal) {
        return;
    }

    modal.classList.add(
        'hidden'
    );

    modal.style.display =
        '';
}


function selectBox6Section(section) {

    if (
        section !== 'new'
        &&
        section !== 'old'
    ) {
        return;
    }

    selectedBoxFilter =
        8;

    selectedBox6Section =
        section;

    sessionQueue =
        [];

    if (randomMode) {

        randomMode =
            false;

        let randomButton =
            document.getElementById(
                'btn-toggle-random-mode'
            );

        randomButton.innerText =
            "ZUFALLSMODUS AUS";

        randomButton.style.backgroundColor =
            "var(--card)";

        randomButton.style.color =
            "var(--text-main)";
    }

    closeBox6SectionModal();

    updateUI();
    next();
}


function toggleBox6Section() {

    if (
        !currentCard
        ||
        currentBoxName !== 'box8'
    ) {
        return;
    }

    ensureBox6Sections();

    currentCard.box6Section =
        currentCard.box6Section === 'new'
        ?
        'old'
        :
        'new';

    sessionQueue =
        [];

    updateUI();
    next();
}


function countHanzi(str) {

    if (!str) {
        return 0;
    }

    let count = 0;

    for (let i = 0; i < str.length; i++) {

        let code = str.charCodeAt(i);

        if (
            (code >= 0x4E00 && code <= 0x9FFF)
            ||
            (code >= 0x3400 && code <= 0x4DBF)
        ) {
            count++;
        }
    }

    return count;
}


function daysBetween(dateStr1, dateStr2) {

    let d1 = new Date(dateStr1);
    let d2 = new Date(dateStr2);

    return Math.round(
        (d2 - d1)
        /
        (
            1000 *
            60 *
            60 *
            24
        )
    );
}


function addDays(dateStr, days) {

    let d =
        dateStr
        ?
        new Date(dateStr)
        :
        new Date();

    d.setDate(
        d.getDate() + days
    );

    return d.toDateString();
}


function isBox6CardDue(c) {

    if (!c.nextReviewDate) {
        return true;
    }

    let today = new Date();

    today.setHours(0,0,0,0);

    let due =
        new Date(c.nextReviewDate);

    due.setHours(0,0,0,0);

    return due <= today;
}


function box6DueInDays(c) {

    if (!c.nextReviewDate) {
        return -9999;
    }

    let today = new Date();

    today.setHours(0,0,0,0);

    let due =
        new Date(c.nextReviewDate);

    due.setHours(0,0,0,0);

    return Math.round(
        (due - today)
        /
        (
            1000 *
            60 *
            60 *
            24
        )
    );
}


function checkBox6DailyReset() {

    let today =
        new Date()
            .toDateString();

    if (
        !state.box6Daily
        ||
        state.box6Daily.date !== today
    ) {

        state.box6Daily = {
            date: today,
            newCount: 0,
            oldCount: 0
        };
    }
}


function updateBox6DailyDisplay() {

    checkBox6DailyReset();

    let el =
        document.getElementById(
            'box6-daily-progress'
        );

    if (el) {

        el.innerText =
            `BOX 8 HEUTE · NEW: ${state.box6Daily.newCount}/100 · OLD: ${state.box6Daily.oldCount}/100`;
    }
}


function openBox6Stats() {

    document
        .getElementById(
            'box6StatsModal'
        )
        .classList
        .remove('hidden');

    renderBox6StatsTable();
}


function closeBox6Stats() {

    document
        .getElementById(
            'box6StatsModal'
        )
        .classList
        .add('hidden');
}


function sortBox6Stats(column) {

    if (
        box6SortColumn === column
    ) {

        box6SortDirection =
            box6SortDirection === 'asc'
            ?
            'desc'
            :
            'asc';

    } else {

        box6SortColumn =
            column;

        box6SortDirection =
            column === 'hz'
            ?
            'asc'
            :
            'desc';
    }

    renderBox6StatsTable();
}


function renderBox6StatsTable() {

    let data =
        state.box8.map(c => {

            let stats =
                c.stats || {
                    queries: 0,
                    correct: 0
                };

            let queries =
                stats.queries || 0;

            let correct =
                stats.correct || 0;

            let wrong =
                queries - correct;

            let rate =
                queries > 0
                ?
                (correct / queries) * 100
                :
                0;

            let dueDays =
                box6DueInDays(c);

            return {
                card: c,
                hz: c.hz || '',
                py: c.py || '',
                de: c.de || '',
                queries,
                correct,
                wrong,
                rate,
                dueDays
            };
        });


    data.sort(
        (a, b) => {

            let valA =
                a[box6SortColumn];

            let valB =
                b[box6SortColumn];

            let cmp;

            if (
                typeof valA === 'string'
            ) {

                cmp =
                    valA.localeCompare(
                        valB,
                        'zh'
                    );

            } else {

                cmp =
                    valA - valB;
            }

            return (
                box6SortDirection === 'asc'
            )
                ?
                cmp
                :
                -cmp;
        }
    );


    let summaryEl =
        document.getElementById(
            'box6-stats-summary'
        );

    let newCount =
        getBox6SectionCount('new');

    let oldCount =
        getBox6SectionCount('old');

    summaryEl.innerText =
        `${data.length} Vokabel${
            data.length === 1
            ?
            ''
            :
            'n'
        } in Box 8 • ${newCount} New • ${oldCount} Old`;


    let tbody =
        document.getElementById(
            'box6-stats-body'
        );


    if (
        data.length === 0
    ) {

        tbody.innerHTML =

            `
            <tr>

                <td
                    colspan="6"
                    style="
                        text-align:center;
                        padding:20px;
                        color:var(--text-muted);
                    "
                >
                    Keine Vokabeln in Box 8
                </td>

            </tr>
            `;

    } else {

        tbody.innerHTML =

            data
            .map(d => {

                let dueLabel;

                if (
                    d.dueDays <= 0
                ) {

                    dueLabel =

                        `
                        <span
                            style="
                                color:var(--box8);
                                font-weight:700;
                            "
                        >
                            jetzt
                        </span>
                        `;

                } else if (
                    d.dueDays === 1
                ) {

                    dueLabel =
                        `in 1 Tag`;

                } else {

                    dueLabel =
                        `in ${d.dueDays} Tg.`;
                }

                return `

                    <tr>

                        <td>

                            <div
                                style="
                                    font-weight:600;
                                    font-size:1.15rem;
                                    font-family:'Songti SC','STSong','Noto Serif CJK SC','SimSun',serif;
                                "
                            >
                                ${d.hz}
                            </div>

                            <div
                                style="
                                    color:var(--primary);
                                    font-size:0.82rem;
                                    font-weight:600;
                                "
                            >
                                ${d.py}
                            </div>

                        </td>

                        <td>
                            ${d.queries}
                        </td>

                        <td
                            style="
                                color:var(--box7);
                                font-weight:700;
                            "
                        >
                            ${d.correct}
                        </td>

                        <td
                            style="
                                color:var(--box1);
                                font-weight:700;
                            "
                        >
                            ${d.wrong}
                        </td>

                        <td
                            style="
                                font-weight:600;
                            "
                        >

                            ${
                                d.queries > 0
                                ?
                                Math.round(d.rate)
                                + '%'
                                :
                                '–'
                            }

                        </td>

                        <td
                            style="
                                font-size:0.82rem;
                            "
                        >
                            ${dueLabel}
                        </td>

                    </tr>

                `;
            })
            .join('');
    }


    let columnIndex = {
        hz: 0,
        queries: 1,
        correct: 2,
        wrong: 3,
        rate: 4,
        dueDays: 5
    };


    let ths =
        document.querySelectorAll(
            '#box6-stats-table th'
        );


    ths.forEach(
        th =>
            th.classList.remove(
                'sorted-asc',
                'sorted-desc'
            )
    );


    let activeTh =
        ths[
            columnIndex[
                box6SortColumn
            ]
        ];


    if (activeTh) {

        activeTh.classList.add(

            box6SortDirection === 'asc'
            ?
            'sorted-asc'
            :
            'sorted-desc'
        );
    }
}


function startQuizForCurrentChar() {

    if (
        currentQuizCharIndex
        >=
        currentQuizChars.length
    ) {
        return;
    }


    if (currentWriter) {

        try {
            currentWriter.cancelQuiz();
        } catch(e) {}

        currentWriter = null;
    }


    let container =
        document.getElementById(
            'writer-container'
        );

    container.innerHTML = '';


    singleCharBox =
        document.createElement(
            'div'
        );

    singleCharBox.className =
        'char-box';

    container.appendChild(
        singleCharBox
    );


    let char =
        currentQuizChars[
            currentQuizCharIndex
        ];


    requestAnimationFrame(
        () => {

            let boxSize =
                Math.min(
                    window.innerHeight * 0.46,
                    window.innerWidth * 0.86,
                    390
                );


            currentWriter =
                HanziWriter.create(

                    singleCharBox,

                    char,

                    {
                        width: boxSize,
                        height: boxSize,
                        showCharacter: false,
                        showOutline: false,

                        padding:
                            Math.floor(
                                boxSize * 0.05
                            ),

                        strokeColor:
                            '#2563EB'
                    }
                );


            currentWriter.quiz({

                onComplete:
                    function() {

                        setTimeout(
                            () => {

                                currentQuizCharIndex++;

                                if (
                                    currentQuizCharIndex
                                    <
                                    currentQuizChars.length
                                ) {

                                    startQuizForCurrentChar();
                                }

                            },
                            300
                        );
                    }
            });
        }
    );
}


function toggleDictMode() {

    dictMode =
        !dictMode;


    let btn =
        document.getElementById(
            'btn-toggle-dict'
        );


    let dictView =
        document.getElementById(
            'dict-view'
        );


    let flashcardElements = [
        'flashcard-content',
        'drawing-controls',
        'learning-tools',
        'special-actions',
        'controls'
    ];


    if (dictMode) {

        btn.style.backgroundColor =
            "var(--primary)";

        btn.style.color =
            "#FFFFFF";

        dictView.classList.remove(
            'hidden'
        );


        flashcardElements
        .forEach(id => {

            let el =
                document.getElementById(

/* ============================================================
   NEU: PINYIN NORMALISIERUNG

   Beispiele:
   nǐ hǎo  -> nihao
   ni hao  -> nihao
   ni-hao  -> nihao
   xuéshēng -> xuesheng
   nǚ -> nu
   nv -> nu
   ============================================================ */

function normalizePinyin(text) {

    if (!text) {
        return "";
    }

    return text
        .toLowerCase()

        /*
        "v" wird häufig als Ersatz für ü eingegeben.
        Deshalb werden beide gleich behandelt.
        */

        .replace(/ü/g, "u")
        .replace(/v/g, "u")

        /*
        Tonzeichen entfernen.
        */

        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")

        /*
        Leerzeichen, Apostrophe, Bindestriche,
        Punkte usw. entfernen.
        */

        .replace(/[^a-z0-9]/g, "");
}

function changeDictBox(
    index,
    newBoxLevel
) {

    let item =
        currentDictResults[
            index
        ];


    let oldBox =
        'box' + item.boxNum;


    let newBox =
        'box' + newBoxLevel;


    if (
        oldBox === newBox
    ) {
        return;
    }


    state[
        oldBox
    ] =

        state[
            oldBox
        ]
        .filter(
            c =>
                c !== item.card
        );


    item.card.lastMovedDate =
        new Date()
            .toDateString();


    if (
        newBox === 'box7'
    ) {

        item.card.box5Streak =
            0;

        item.card.box5LastCorrectDate =
            null;
    }

    if (
        newBox === 'box8'
        &&
        oldBox !== 'box8'
    ) {

        item.card.box6Section =
            'new';
    }


    state[
        newBox
    ].push(
        item.card
    );


    sessionQueue = [];

    updateUI();

    searchDict();
}

function parseCSVLine(text) {

    let fields = [];
    let field = "";
    let inQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        let char =
            text[i];


        if (
            char === '"'
            ||
            char === '„'
            ||
            char === '“'
            ||
            char === '”'
        ) {

            inQuotes =
                !inQuotes;

        } else if (
            char === ','
            &&
            !inQuotes
        ) {

            fields.push(
                cleanField(field)
            );

            field = "";

        } else {

            field +=
                char;
        }
    }


    fields.push(
        cleanField(field)
    );


    return fields;
}


function cleanField(str) {

    let t =
        str.trim();


    if (
        (
            t.startsWith('"')
            &&
            t.endsWith('"')
        )
        ||
        (
            t.startsWith('„')
            &&
            t.endsWith('“')
        )
    ) {

        t =
            t.substring(
                1,
                t.length - 1
            );
    }


    return t.trim();
}


function importCSV(file) {

    if (!file) {
        return;
    }


    const targetBox =

        confirm(

            "Vokabeln als bereits bekannt markieren (Box 7)?\nWählen Sie 'Abbrechen' für neue Vokabeln (Box 1)."

        )

        ?

        'box7'

        :

        'box1';


    let detectedLevel =
        "Import";


    let match =

        file.name
            .toLowerCase()
            .match(
                /hsk\s*([1-6])/
            );


    if (match) {

        detectedLevel =
            "HSK " + match[1];
    }


    const reader =
        new FileReader();


    reader.onload =
        (e) => {

            const rows =

                e.target.result
                    .replace(/\r/g, "")
                    .split('\n');


            rows.forEach(r => {

                if (!r.trim()) {
                    return;
                }


                const p =
                    parseCSVLine(r);


                if (
                    p.length >= 3
                ) {

                    state[
                        targetBox
                    ]
                    .push({

                        hz:
                            p[0],

                        py:
                            p[1],

                        de:
                            p[2],

                        sentenceHz:
                            p[3] || '',

                        sentencePy:
                            p[4] || '',

                        sentenceDe:
                            p[5] || '',

                        level:
                            p[6]

                            ?

                            p[6].trim()

                            :

                            detectedLevel,

                        stats: {
                            queries: 0,
                            correct: 0
                        }
                    });
                }
            });


            sessionQueue = [];

            updateUI();

            next();
        };


    reader.readAsText(
        file
    );
}


function next() {

    if (dictMode) {
        return;
    }


    if (
        sessionQueue.length === 0
    ) {

        let pool = [];


        const boxWeights = [
            0,
            16,
            12,
            10,
            8,
            4,
            2,
            1,
            1
        ];


        if (
            selectedBoxFilter === 8
        ) {

            ensureBox6Sections();

            let cards =
                state.box8.filter(
                    c =>
                        c.box6Section ===
                        selectedBox6Section
                );


            cards.sort(
                (a, b) => {

                    let dateA =
                        a.lastMovedDate
                        ?
                        new Date(
                            a.lastMovedDate
                        ).getTime()
                        :
                        0;

                    let dateB =
                        b.lastMovedDate
                        ?
                        new Date(
                            b.lastMovedDate
                        ).getTime()
                        :
                        0;

                    return dateA - dateB;
                }
            );


            let targetBatch =
                cards.slice(
                    0,
                    100
                );


            targetBatch
                .forEach(
                    c =>
                        pool.push({
                            c,
                            box: 'box8'
                        })
                );


            for (
                let i =
                    pool.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random()
                        *
                        (i + 1)
                    );


                [
                    pool[i],
                    pool[j]
                ]
                =
                [
                    pool[j],
                    pool[i]
                ];
            }


            sessionQueue =
                pool;


        } else {

            for (
                let i = 1;
                i <= 8;
                i++
            ) {

                if (
                    selectedBoxFilter !== null
                    &&
                    i !== selectedBoxFilter
                ) {
                    continue;
                }


                state[
                    'box'+i
                ]
                .forEach(c => {


                    if (!c.stats) {

                        c.stats = {
                            queries: 0,
                            correct: 0
                        };
                    }


                    if (
                        selectedBoxFilter !== null
                    ) {

                        pool.push({
                            c,
                            box:
                                'box'+i
                        });

                    } else {

                        let weight =
                            1;


                        if (!randomMode) {

                            if (
                                i === 8
                            ) {

                                if (
                                    !isBox6CardDue(c)
                                ) {
                                    return;
                                }

                                weight =
                                    1;

                            } else {

                                weight =
                                    boxWeights[i];
                            }
                        }


                        for (
                            let j = 0;
                            j < weight;
                            j++
                        ) {

                            pool.push({
                                c,
                                box:
                                    'box'+i
                            });
                        }
                    }
                });
            }


            for (
                let i =
                    pool.length - 1;
                i > 0;
                i--
            ) {

                const j =
                    Math.floor(
                        Math.random()
                        *
                        (i + 1)
                    );


                [
                    pool[i],
                    pool[j]
                ]
                =
                [
                    pool[j],
                    pool[i]
                ];
            }


            sessionQueue =
                pool;
        }


        if (

                .classList

            /\s/g,

        '';

        [];


    for (
        let i = 0;
        i < cleanHz.length;
        i++
    ) {

        let code =
            cleanHz.charCodeAt(i);


        if (
            (
                code >= 0x4E00
                &&
                code <= 0x9FFF
            )
            ||
            (
                code >= 0x3400
                &&
                code <= 0x4DBF
            )
        ) {

            currentQuizChars.push(
                cleanHz[i]
            );
        }
    }


    currentQuizCharIndex =
        0;


    if (
        currentQuizChars.length > 0
    ) {

        startQuizForCurrentChar();
    }

            +
            ` • ${percent}% ERFOLG`;

    } else if (
        currentBoxName === 'box7'
    ) {

        let streak =
            currentCard.box5Streak || 0;

        statsInfo =
            ` • STREAK: ${streak}/3 TAGEN`;
    }


    document
        .getElementById(
            'v-box'
        )
        .innerText =

            (
                currentCard.level
                ||
                "UNBEKANNT"
            )

            +

            statsInfo;


    document
        .getElementById(
            'v-de'
        )
        .innerText =
            currentCard.de;


    let hzElement =
        document.getElementById(
            'v-hz'
        );


    let cleanHz =

        currentCard.hz
        ?
        currentCard.hz.replace(
            /\s/g,
            ''
        )
        :
        '';


    hzElement
        .classList
        .toggle(
            'long-char',
            cleanHz.length > 3
        );


    hzElement.innerText =
        currentCard.hz;


    document
        .getElementById(
            'v-py'
        )
        .innerText =
            currentCard.py;


    hzElement
        .classList
        .remove('hidden');


    document
        .getElementById(
            'v-py'
        )
        .classList
        .remove('hidden');


    let statsElement =
        document.getElementById(
            'v-stats'
        );


    let statsText =
        "";


    if (
        currentCard.stats
        &&
        currentCard.stats.queries > 0
    ) {

        let percent =

            Math.round(

                (
                    currentCard.stats.correct
                    /
                    currentCard.stats.queries
                )

                *

                100
            );


        statsText =

            `
            Abgefragt:
            <b>
                ${currentCard.stats.queries}x
            </b>

            &nbsp;|&nbsp;

            Richtig:
            <b>
                ${currentCard.stats.correct}x
            </b>

            (${percent}%)
            `;

    } else {

        statsText =

            "<i>Noch keine Statistik vorhanden</i>";
    }


    if (
        currentBoxName === 'box7'
    ) {

        let streak =
            currentCard.box5Streak || 0;


        statsText +=

            `
            <br>

            <span
                style="
                    color:var(--box7);
                    font-weight:700;
                "
            >
                Box 8 Fortschritt:
                ${streak}
                von 3 Tagen in Folge richtig
            </span>
            `;
    }


    statsElement.innerHTML =
        statsText;


    statsElement
        .classList
        .remove('hidden');


    let btnExample =
        document.getElementById(
            'btn-example-trigger'
        );


    if (
        currentCard.sentenceHz
    ) {

        document
            .getElementById(
                'ex-hz'
            )
            .innerText =
                currentCard.sentenceHz;


        document
            .getElementById(
                'ex-py'
            )
            .innerText =
                currentCard.sentencePy;


        document
            .getElementById(
                'ex-de'
            )
            .innerText =
                currentCard.sentenceDe;


        btnExample.disabled =
            false;

    } else {

        btnExample.disabled =
            true;
    }


    let box6ActionButton =
        document.getElementById(
            'btn-box6-action'
        );

    if (
        currentBoxName === 'box8'
    ) {

        ensureBox6Sections();

        box6ActionButton.innerText =
            currentCard.box6Section === 'new'
            ?
            "ZU BOX 8 OLD"
            :
            "ZU BOX 8 NEW";

        box6ActionButton.onclick =
            toggleBox6Section;

    } else {

        box6ActionButton.innerText =
            "ZU BOX 8";

        box6ActionButton.onclick =
            moveToBox6;
    }


    document
        .getElementById(
            'writer-container'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'drawing-controls'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'learning-tools'
        )
        .classList
        .remove('hidden');


    document
        .getElementById(
            'special-actions'
        )
        .classList
        .remove('hidden');


    document
        .getElementById(
            'controls'
        )
        .classList
        .remove('hidden');
}


function retryCurrentWordWriting() {

    if (!currentCard) {
        return;
    }


    let hCount =
        countHanzi(
            currentCard.hz
        );


    let tagHtml =

        hCount > 0

        ?

        `
        <span class="char-tag">
            (${hCount} ${hCount === 1 ? 'Zeichen' : 'Zeichen'})
        </span>
        `

        :

        '';


    document
        .getElementById(
            'v-de'
        )
        .innerHTML =

            currentCard.de

            +

            tagHtml;


    document
        .getElementById(
            'v-hz'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'v-py'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'v-stats'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'learning-tools'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'special-actions'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'controls'
        )
        .classList
        .add('hidden');


    document
        .getElementById(
            'drawing-controls'
        )
        .classList
        .remove('hidden');


    const container =
        document.getElementById(
            'writer-container'
        );


    container.innerHTML =
        '';


    container
        .classList
        .remove('hidden');


    currentWriter =
        null;

    singleCharBox =
        null;

    currentQuizChars =
        [];


    let cleanHz =

        currentCard.hz
        ?
        currentCard.hz.replace(
            /\s/g,
            ''
        )
        :
        '';


    for (
        let i = 0;
        i < cleanHz.length;
        i++
    ) {

        let code =
            cleanHz.charCodeAt(i);


        if (
            (
                code >= 0x4E00
                &&
                code <= 0x9FFF
            )
            ||
            (
                code >= 0x3400
                &&
                code <= 0x4DBF
            )
        ) {

            currentQuizChars.push(
                cleanHz[i]
            );
        }
    }


    currentQuizCharIndex =
        0;


    if (
        currentQuizChars.length > 0
    ) {

        startQuizForCurrentChar();
    }
}


function openModal() {

    document
        .getElementById(
            'exampleModal'
        )
        .classList
        .remove('hidden');
}


function closeModal() {

    document
        .getElementById(
            'exampleModal'
        )
        .classList
        .add('hidden');
}


function move(step) {

    if (!currentCard) {
        return;
    }


    if (!currentCard.stats) {

        currentCard.stats = {
            queries: 0,
            correct: 0
        };
    }


    currentCard.stats.queries++;


    if (
        step === 1
    ) {

        currentCard.stats.correct++;
    }


    let oldBox =

        Object
            .keys(state)
            .find(
                k =>
                    Array.isArray(state[k])
                    &&
                    state[k].includes(currentCard)
            );


    let today =
        new Date()
            .toDateString();


    if (
        currentCard.lastSeenDate !== today
    ) {

        currentCard.lastSeenDate =
            today;

        currentCard.todayRounds =
            0;
    }


    currentCard.todayRounds++;


    if (
        oldBox === 'box8'
    ) {

        checkBox6DailyReset();

        ensureBox6Sections();

        if (
            currentCard.box6Section === 'new'
        ) {
            state.box6Daily.newCount++;
        } else {
            state.box6Daily.oldCount++;
        }
    }


    let level =
        parseInt(
            oldBox.replace(
                'box',
                ''
            )
        );


    state[
        oldBox
    ] =

        state[
            oldBox
        ]
        .filter(
            c =>
                c !== currentCard
        );


    let effectiveStep =
        step;


    if (
        currentCard.lastMovedDate === today
    ) {

        effectiveStep =
            0;

    } else {

        currentCard.lastMovedDate =
            today;
    }


    let newLevel;


    if (
        oldBox === 'box7'
    ) {

        if (
            step === 1
        ) {

            if (
                !currentCard.box5Streak
            ) {

                currentCard.box5Streak =
                    0;
            }


            let daysDiff =

                currentCard.box5LastCorrectDate

                ?

                daysBetween(
                    currentCard.box5LastCorrectDate,
                    today
                )

                :

                -1;


            if (
                daysDiff === 1
            ) {

                currentCard.box5Streak++;

                currentCard.box5LastCorrectDate =
                    today;

            } else if (
                daysDiff === 0
            ) {

                // gleicher Tag

            } else {

                currentCard.box5Streak =
                    1;

                currentCard.box5LastCorrectDate =
                    today;
            }


            if (
                currentCard.box5Streak >= 3
            ) {

                newLevel =
                    8;

                currentCard.box5Streak =
                    0;

                currentCard.box5LastCorrectDate =
                    null;

            } else {

                newLevel =
                    7;
            }

        } else {

            currentCard.box5Streak =
                0;

            currentCard.box5LastCorrectDate =
                null;


            newLevel =

                Math.min(

                    Math.max(

                        level
                        +
                        effectiveStep,

                        1
                    ),

                    8
                );
        }

    } else {

        newLevel =

            Math.min(

                Math.max(

                    level
                    +
                    effectiveStep,

                    1
                ),

                8
            );
    }


    if (
        oldBox === 'box8'
    ) {

        if (
            newLevel === 8
        ) {

            if (
                effectiveStep === 1
            ) {

                currentCard.box6Interval =

                    currentCard.box6Interval

                    ?

                    Math.min(
                        currentCard.box6Interval * 2,
                        60
                    )

                    :

                    2;

            } else if (
                !currentCard.box6Interval
            ) {

                currentCard.box6Interval =
                    1;
            }


            currentCard.nextReviewDate =

                addDays(
                    today,
                    currentCard.box6Interval
                );

        } else {

            currentCard.box6Interval =
                0;

            currentCard.nextReviewDate =
                null;
        }
    }


    if (
        newLevel === 8
        &&
        oldBox !== 'box8'
    ) {

        currentCard.box6Section =
            'new';
    }


    state[
        'box' + newLevel
    ].push(
        currentCard
    );


    updateUI();

    next();
}


function moveToBox6() {

    if (!currentCard) {
        return;
    }


    let oldBox =

        Object
            .keys(state)
            .find(
                k =>
                    Array.isArray(state[k])
                    &&
                    state[k].includes(currentCard)
            );


    if (oldBox) {

        state[
            oldBox
        ] =

            state[
                oldBox
            ]
            .filter(
                c =>
                    c !== currentCard
            );
    }


    currentCard.lastMovedDate =
        new Date()
            .toDateString();


    currentCard.box5Streak =
        0;

    currentCard.box5LastCorrectDate =
        null;

    currentCard.box6Interval =
        1;

    currentCard.nextReviewDate =
        null;

    currentCard.box6Section =
        'new';


    state.box8.push(
        currentCard
    );


    updateUI();

    next();
}


function resetSpeicher() {

    if (
        confirm(
            "Möchten Sie den Lernstand wirklich vollständig löschen? Dieser Vorgang kann nicht rückgängig gemacht werden."
        )
    ) {

        state = {
            box1: [],
            box2: [],
            box3: [],
            box4: [],
            box5: [],
            box6: [],
            box7: [],
            box8: [],
            boxLayoutVersion: 2
        };

        sessionQueue = [];

        updateUI();

        location.reload();
    }
}


function exportProgress() {

    const dataStr =

        "data:text/json;charset=utf-8,"

        +

        encodeURIComponent(

            JSON.stringify(
                state
            )
        );


    const dl =
        document.createElement(
            'a'
        );


    dl.setAttribute(
        "href",
        dataStr
    );


    dl.setAttribute(
        "download",
        "hsk_trainer_backup.json"
    );


    dl.click();
}


function importProgress(file) {

    const reader =
        new FileReader();


    reader.onload =
        (e) => {

            state =
                JSON.parse(
                    e.target.result
                );


            migrateBoxLayout();

            ensureBox6Sections();


            if (!state.box6Daily) {

                state.box6Daily = {
                    date:
                        new Date()
                            .toDateString(),

                    newCount:
                        0,

                    oldCount:
                        0
                };

            } else if (
                typeof state.box6Daily.newCount !== 'number'
                ||
                typeof state.box6Daily.oldCount !== 'number'
            ) {

                state.box6Daily = {
                    date:
                        state.box6Daily.date
                        ||
                        new Date()
                            .toDateString(),

                    newCount:
                        0,

                    oldCount:
                        0
                };
            }

            sessionQueue =
                [];

            updateUI();

            next();
        };


    reader.readAsText(
        file
    );
}


function clearCanvas() {

    if (currentWriter) {

        try {
            currentWriter.cancelQuiz();
        } catch(e) {}
    }


    currentQuizCharIndex =
        0;


    startQuizForCurrentChar();
}


function speak() {

    if (!currentCard) {
        return;
    }


    window
        .speechSynthesis
        .cancel();


    const u =

        new SpeechSynthesisUtterance(
            currentCard.hz
        );


    u.lang =
        'zh-CN';


    window
        .speechSynthesis
        .speak(u);
}


updateUI();

next();

</script>
