<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="HSK Trainer">
    <title>HSK Trainer</title>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <style>
        /* Helles Design (Standard) */
        :root { 
            --bg: #f1f5f9; 
            --card: #ffffff; 
            --text-main: #0f172a; 
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            
            --primary: #2563eb; 
            --primary-light: #eff6ff;
            --focus-color: #ea580c; 
            --dark-btn: #334155;
            
            --box1: #ef4444; 
            --box2: #f59e0b; 
            --box3: #3b82f6; 
            --box4: #8b5cf6; 
            --box5: #10b981; 
            
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Nativer Dark Mode */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a; 
                --card: #1e293b; 
                --text-main: #f8fafc; 
                --text-muted: #94a3b8;
                --border-light: #334155;
                
                --primary: #3b82f6; 
                --primary-light: #1e3a8a;
                --focus-color: #f97316; 
                --dark-btn: #475569;
                
                --box1: #f87171; 
                --box2: #fbbf24; 
                --box3: #60a5fa; 
                --box4: #a78bfa; 
                --box5: #34d399; 
                
                --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            }
        }
        
        * { box-sizing: border-box; }
        
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        
        .container { 
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto; 
            display: flex;
            flex-direction: column;
            padding: 12px; /* Etwas mehr Seitenrand */
        }
        
        /* Navigations-Bereich (Stark vergrößert, bis zur blauen Linie) */
        .header {
            display: flex;
            flex-direction: column;
            gap: 14px; /* Mehr Abstand zwischen den Reihen */
            flex-shrink: 0;
            margin-bottom: 12px;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-top h2 {
            margin: 0;
            font-size: 1.5rem; /* Größere Überschrift */
            font-weight: 800;
        }
        
        .system-buttons {
            display: flex;
            gap: 8px; /* Mehr Platz zwischen den oberen Knöpfen */
        }
        
        .system-buttons button {
            font-size: 0.95rem; /* Größere Schrift */
            padding: 12px 14px; /* Sehr dicke, fette Buttons */
            border-radius: 10px;
            background: var(--card);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            font-weight: 600;
        }
        .system-buttons .btn-danger { color: var(--box1); border-color: rgba(239, 68, 68, 0.3); }
        .system-buttons .btn-action { background: var(--primary); color: white; border: none; }

        .filter-buttons {
            display: flex;
            gap: 10px; /* Breite Lücken */
        }
        
        .filter-buttons button {
            flex: 1; 
            font-size: 1.1rem; /* Sehr große Schrift für gute Lesbarkeit */
            padding: 16px; /* Massive Höhe für die Filter-Buttons */
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--card);
            color: var(--text-main);
            font-weight: 600;
        }
        
        /* Statistik (Ebenfalls vergrößert) */
        .stats { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            background: var(--card);
            padding: 10px; /* Dickerer Rahmen */
            border-radius: 12px;
            border: 1px solid var(--border-light);
            flex-shrink: 0;
            margin-bottom: 14px; /* Mehr Platz zur Hauptkarte */
            box-shadow: var(--shadow);
        }
        .stat-box { 
            padding: 8px 4px; /* Größere Trefferfläche, sieht edler aus */
            border-radius: 8px; 
            text-align: center; 
            font-size: 0.85rem; /* Etwas größer */
            font-weight: 700; 
            border: 2px solid transparent;
            color: var(--text-muted);
            background: var(--bg);
        }
        #stat-box-1 { color: var(--box1); }
        #stat-box-2 { color: var(--box2); }
        #stat-box-3 { color: var(--box3); }
        #stat-box-4 { color: var(--box4); }
        #stat-box-5 { color: var(--box5); }
        
        .stat-box.active-box { 
            border-color: currentColor; 
            background: var(--card);
        }
        .stat-box.inactive-box { opacity: 0.4; }

        /* Hauptkarte */
        .card { 
            background: var(--card); 
            border-radius: 16px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
            padding: 16px 20px; 
        }
        
        /* Zentraler Bereich für Vokabel & Zeichenbox */
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px; 
            flex-grow: 1;
            text-align: center;
        }

        #v-box { 
            font-size: 0.75rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 4px 12px;
            background: var(--bg);
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }

        #v-de {
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--text-main); 
            word-break: break-word; 
            line-height: 1.2;
            margin: 0;
        }
        
        #v-hz {
            font-size: 5rem; 
            color: var(--text-main);
            font-weight: 500;
            line-height: 1;
            margin: 0;
        }
        #v-hz.long-char { font-size: 3.5rem; }

        #v-py {
            font-size: 1.25rem; 
            color: var(--primary); 
            font-weight: 500; 
            margin: 0;
        }
        
        /* Zeichenbox (Drastisch vergrößertes Maximum - füllt die rote Box) */
        .writer-grid { 
            display: flex; 
            justify-content: center; 
            align-items: center;
            width: 100%;
        }
        
        .char-box { 
            width: 100%;
            height: 100%;
            max-width: 400px;  /* Von 280px auf fast Vollbild-Breite erhöht */
            max-height: 400px; /* Quadratisch */
            aspect-ratio: 1/1; 
            border: 2px dashed var(--border-light); 
            border-radius: 16px; 
            background: var(--bg); 
            transition: border-color 0.2s;
        }
        .char-box:active { border-color: var(--primary); }

        /* Action Buttons Container */
        .action-area {
            margin-top: auto; 
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
        }

        button { 
            border: none; 
            margin: 0; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: opacity 0.1s;
        }
        button:active { opacity: 0.7; }
        button:disabled { opacity: 0.3 !important; cursor: not-allowed; }
        
        /* Button Layouts */
        .row-2 { display: flex; gap: 8px; width: 100%; }
        .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
        
        .btn-large { padding: 14px; border-radius: 12px; font-size: 1rem; }
        .btn-medium { padding: 12px; border-radius: 10px; font-size: 0.95rem; }
        
        .btn-primary { background: var(--primary); color: white; flex: 2; box-shadow: var(--shadow); }
        .btn-secondary { background: var(--bg); color: var(--text-main); border: 1px solid var(--border-light); flex: 1; }
        
        .btn-tool { background: var(--primary-light); color: var(--primary); flex-direction: column; gap: 2px; padding: 12px 4px; font-size: 0.8rem; border-radius: 10px; }
        .btn-tool span { font-size: 1.3rem; }
        
        .btn-grade { color: white; padding: 14px 4px; font-size: 1rem; border-radius: 12px; }
        
        .hidden { display: none !important; }
        
        /* Modal */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0, 0.6); backdrop-filter: blur(4px);
            display: flex; justify-content: center; align-items: center; 
            z-index: 1000; padding: 20px; 
        }
        .modal-content { 
            background: var(--card); padding: 24px; border-radius: 16px; 
            width: 100%; max-width: 400px; max-height: 80vh; 
            display: flex; flex-direction: column; box-shadow: var(--shadow); 
        }
        
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <h2>HSK Trainer</h2>
            <div class="system-buttons">
                <input type="file" id="csvFile" class="hidden" onchange="importCSV(this.files[0])" accept=".csv">
                <button class="btn-action" onclick="document.getElementById('csvFile').click()">+ CSV</button>
                <button onclick="exportProgress()">Backup</button>
                <input type="file" id="jsonFile" class="hidden" onchange="importProgress(this.files[0])" accept=".json">
                <button onclick="document.getElementById('jsonFile').click()">Laden</button>
                <button class="btn-danger" onclick="resetSpeicher()">Löschen</button>
            </div>
        </div>
        <div class="filter-buttons">
            <button id="btn-toggle-only-focus" onclick="toggleOnlyFocusMode()">🎯 Alle (0)</button>
            <button id="btn-toggle-box5-mode" onclick="toggleBox5Mode()">⭐ B5 Aus</button>
            <button id="btn-toggle-dict" onclick="toggleDictMode()">🔍 Wörterbuch</button>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats" id="stats"></div>

    <!-- Main Card -->
    <div class="card">
        
        <!-- Wörterbuch View -->
        <div id="dict-view" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-shrink: 0;">
                <input type="text" id="dict-search-input" placeholder="Suchbegriff..." onkeypress="if(event.key === 'Enter') searchDict()" style="flex-grow: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-light); font-size: 1.05rem; background: var(--bg); color: var(--text-main);">
                <button class="btn-primary btn-medium" style="flex: 0 1 auto; padding: 0 20px;" onclick="searchDict()">Suchen</button>
            </div>
            <div id="dict-results" style="overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column; gap: 8px;"></div>
        </div>

        <!-- Lern-Ansicht -->
        <div id="flashcard-content" class="card-content">
            <div id="v-box"></div>
            <div id="v-de">Bitte CSV laden...</div>
            
            <div id="v-hz" class="hidden"></div>
            <div id="v-py" class="hidden"></div>
            
            <div id="writer-container" class="writer-grid hidden"></div>
        </div>
        
        <!-- Action Areas (Gepinnt am unteren Rand) -->
        <div class="action-area">
            
            <!-- Modus: Zeichnen -->
            <div id="drawing-controls" class="row-2 hidden">
                <button id="btn-clear" class="btn-secondary btn-large" onclick="clearCanvas()">🔄 Neu</button>
                <button id="btn-show" class="btn-primary btn-large" onclick="flip()">Lösung zeigen</button>
            </div>

            <!-- Modus: Lösung (Lern-Tools) -->
            <div id="learning-tools" class="row-3 hidden">
                <button class="btn-tool" onclick="speak()"><span>🔊</span> Audio</button>
                <button class="btn-tool" onclick="retryCurrentWordWriting()"><span>✍️</span> Üben</button>
                <button id="btn-example-trigger" class="btn-tool" onclick="openModal()"><span>📖</span> Beispiel</button>
            </div>
            
            <!-- Modus: Lösung (Fokus & B5) -->
            <div id="special-actions" class="row-2 hidden">
                <button id="btn-focus" class="btn-secondary btn-medium" style="color: var(--focus-color); border-color: var(--focus-color);" onclick="toggleFocus()">🎯 Fokus setzen</button>
                <button class="btn-secondary btn-medium" onclick="moveToBox5()">⭐ Direkt Box 5</button>
            </div>
            
            <!-- Modus: Lösung (Bewertung) -->
            <div id="controls" class="row-3 hidden">
                <button class="btn-grade" style="background: var(--box1);" onclick="move(-1)">Falsch</button>
                <button class="btn-grade" style="background: var(--box2);" onclick="move(0)">Halten</button>
                <button class="btn-grade" style="background: var(--box5);" onclick="move(1)">Richtig</button>
            </div>
            
        </div>
    </div>
</div>

<!-- Modal Beispielsatz -->
<div id="exampleModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--text-main); font-size: 1.1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 12px; margin-bottom: 16px;">Beispielsatz</h3>
        <div style="overflow-y: auto; flex-grow: 1; margin-bottom: 16px;">
            <div id="ex-hz" style="font-size: 1.5rem; font-weight: 500; margin-bottom: 4px;"></div>
            <div id="ex-py" style="color: var(--primary); margin-bottom: 12px;"></div>
            <div id="ex-de" style="background: var(--bg); padding: 12px; border-radius: 10px; border-left: 3px solid var(--primary); font-size: 0.95rem; line-height: 1.4;"></div>
        </div>
        <button class="btn-secondary btn-large" onclick="closeModal()">Schließen</button>
    </div>
</div>

<script>
let state = JSON.parse(localStorage.getItem('hsk_data')) || { box1: [], box2: [], box3: [], box4: [], box5: [] };
let currentCard = null;
let currentBoxName = ""; 

let currentQuizChars = [];
let currentQuizCharIndex = 0;
let currentWriter = null;
let singleCharBox = null;

let onlyFocusMode = false; 
let box5Mode = false;       
let dictMode = false;       
let currentDictResults = []; 

function startQuizForCurrentChar() {
    if (!singleCharBox || currentQuizCharIndex >= currentQuizChars.length) return;
    
    singleCharBox.innerHTML = ''; 
    let char = currentQuizChars[currentQuizCharIndex];
    
    // JS-Berechnung: Erlaubt der Box jetzt, bis zu 90% der Bildschirmbreite oder 50% der Höhe einzunehmen (Maximal 400px)
    let boxSize = Math.min(window.innerHeight * 0.5, window.innerWidth * 0.9, 400);
    
    currentWriter = HanziWriter.create(singleCharBox, char, { 
        width: boxSize, 
        height: boxSize, 
        showCharacter: false, 
        showOutline: false, 
        padding: Math.floor(boxSize * 0.05), 
        strokeColor: '#3b82f6' 
    });
    
    currentWriter.quiz({
        onComplete: function() {
            setTimeout(() => {
                currentQuizCharIndex++;
                if (currentQuizCharIndex < currentQuizChars.length) {
                    startQuizForCurrentChar();
                }
            }, 300); 
        }
    });
}

function getFocusCount() {
    let count = 0;
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            if (c.inFocus) count++;
        });
    }
    return count;
}

function toggleDictMode() {
    dictMode = !dictMode;
    let btn = document.getElementById('btn-toggle-dict');
    let dictView = document.getElementById('dict-view');
    let flashcardElements = ['flashcard-content', 'drawing-controls', 'learning-tools', 'special-actions', 'controls'];
    
    if (dictMode) {
        btn.style.background = "var(--primary)";
        btn.style.color = "white";
        dictView.classList.remove('hidden');
        
        flashcardElements.forEach(id => {
            let el = document.getElementById(id);
            if (el) el.classList.add('hidden');
        });
        
        document.getElementById('dict-search-input').value = "";
        document.getElementById('dict-results').innerHTML = "";
        document.getElementById('dict-search-input').focus();
    } else {
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        dictView.classList.add('hidden');
        document.getElementById('flashcard-content').classList.remove('hidden');
        next(); 
    }
}

function searchDict() {
    let query = document.getElementById('dict-search-input').value.trim().toLowerCase();
    let resultsContainer = document.getElementById('dict-results');
    resultsContainer.innerHTML = "";
    
    if (!query) return;

    let allCards = [];
    for (let i = 1; i <= 5; i++) {
        state['box' + i].forEach(c => {
            allCards.push({ card: c, boxNum: i });
        });
    }

    currentDictResults = allCards.filter(item => 
        item.card.de.toLowerCase().includes(query) || 
        item.card.py.toLowerCase().includes(query) ||
        item.card.hz.includes(query)
    );

    if (currentDictResults.length === 0) {
        resultsContainer.innerHTML = "<p style='color: var(--text-muted); text-align: center; font-size: 0.95rem;'>Keine Ergebnisse gefunden.</p>";
        return;
    }

    currentDictResults.forEach((item, index) => {
        let c = item.card;
        let boxNum = item.boxNum;
        let div = document.createElement('div');
        div.style.cssText = "background: var(--bg); padding: 12px; border-radius: 12px; border: 1px solid var(--border-light);";
        
        let focusBtnBg = c.inFocus ? "var(--focus-color)" : "transparent";
        let focusBtnColor = c.inFocus ? "white" : "var(--text-muted)";
        let focusBtnBorder = c.inFocus ? "var(--focus-color)" : "var(--border-light)";

        let html = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <div style="font-size: 1.5rem; font-weight: 500;">${c.hz}</div>
                <div style="display: flex; gap: 6px;">
                    <button onclick="toggleDictFocus(${index})" style="padding: 6px 10px; font-size: 0.8rem; border-radius: 10px; background: ${focusBtnBg}; color: ${focusBtnColor}; border: 1px solid ${focusBtnBorder};">🎯</button>
                    <select onchange="changeDictBox(${index}, this.value)" style="background: var(--box${boxNum}); color: white; padding: 6px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: bold; border: none; outline: none;">
                        <option value="1" style="color: black; background: white;" ${boxNum == 1 ? 'selected' : ''}>B1</option>
                        <option value="2" style="color: black; background: white;" ${boxNum == 2 ? 'selected' : ''}>B2</option>
                        <option value="3" style="color: black; background: white;" ${boxNum == 3 ? 'selected' : ''}>B3</option>
                        <option value="4" style="color: black; background: white;" ${boxNum == 4 ? 'selected' : ''}>B4</option>
                        <option value="5" style="color: black; background: white;" ${boxNum == 5 ? 'selected' : ''}>B5</option>
                    </select>
                </div>
            </div>
            <div style="color: var(--primary); font-size: 1rem; margin-bottom: 4px;">${c.py}</div>
            <div style="font-size: 1.05rem; font-weight: 600;">${c.de}</div>
        `;
        
        if (c.sentenceHz) {
            html += `
                <div style="border-top: 1px solid var(--border-light); padding-top: 8px; margin-top: 8px; font-size: 0.9rem;">
                    <div>${c.sentenceHz}</div>
                    <div style="color: var(--primary); margin: 2px 0;">${c.sentencePy}</div>
                    <div style="color: var(--text-muted);">${c.sentenceDe}</div>
                </div>
            `;
        }
        
        div.innerHTML = html;
        resultsContainer.appendChild(div);
    });
}

function toggleDictFocus(index) {
    let item = currentDictResults[index];
    if (!item.card.inFocus && getFocusCount() >= 150) {
        alert("Maximal 150 Vokabeln im Fokus erlaubt!");
        return;
    }
    item.card.inFocus = !item.card.inFocus;
    if (item.card.inFocus) item.card.correctCount = 0;
    updateUI(); searchDict(); 
}

function changeDictBox(index, newBoxLevel) {
    let item = currentDictResults[index];
    let oldBox = 'box' + item.boxNum;
    let newBox = 'box' + newBoxLevel;
    if (oldBox === newBox) return; 
    state[oldBox] = state[oldBox].filter(c => c !== item.card);
    item.card.lastMovedDate = new Date().toDateString();
    state[newBox].push(item.card);
    updateUI(); searchDict(); 
}

function updateUI() {
    document.getElementById('stats').innerHTML = [1,2,3,4,5].map(i => `<div id="stat-box-${i}" class="stat-box">B${i}<br>${state['box'+i].length}</div>`).join('');
    localStorage.setItem('hsk_data', JSON.stringify(state));
    highlightActiveBox(); 
    updateFocusButtonText();
}

function highlightActiveBox() {
    [1,2,3,4,5].forEach(i => {
        let element = document.getElementById(`stat-box-${i}`);
        if (element) {
            element.classList.remove('active-box', 'inactive-box');
            if (currentBoxName === 'box' + i) {
                element.classList.add('active-box');
            } else if (currentBoxName !== "") {
                element.classList.add('inactive-box');
            }
        }
    });
}

function updateFocusButtonText() {
    let btn = document.getElementById('btn-toggle-only-focus');
    let count = getFocusCount();
    btn.innerText = `🎯 Alle (${count})`;
    if (onlyFocusMode) {
        btn.innerText = `🎯 Fokus (${count})`;
    }
}

function toggleOnlyFocusMode() {
    onlyFocusMode = !onlyFocusMode;
    let btn = document.getElementById('btn-toggle-only-focus');
    if (onlyFocusMode) {
        btn.style.background = "var(--focus-color)";
        btn.style.color = "white";
        btn.style.borderColor = "var(--focus-color)";
        if(box5Mode) toggleBox5Mode();
    } else {
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        btn.style.borderColor = "var(--border-light)";
    }
    updateFocusButtonText();
    next();
}

function toggleBox5Mode() {
    box5Mode = !box5Mode;
    let btn = document.getElementById('btn-toggle-box5-mode');
    if (box5Mode) {
        btn.innerText = "⭐ Nur B5";
        btn.style.background = "var(--box5)";
        btn.style.color = "white";
        btn.style.borderColor = "var(--box5)";
        if(onlyFocusMode) toggleOnlyFocusMode();
    } else {
        btn.innerText = "⭐ B5 Aus";
        btn.style.background = "var(--card)";
        btn.style.color = "var(--text-main)";
        btn.style.borderColor = "var(--border-light)";
    }
    next();
}

function parseCSVLine(text) {
    let fields = []; let field = ""; let inQuotes = false;
    for (let i = 0; i < text.length; i++) {
        let char = text[i];
        if (char === '"' || char === '„' || char === '“' || char === '”') { inQuotes = !inQuotes; } 
        else if (char === ',' && !inQuotes) { fields.push(cleanField(field)); field = ""; } 
        else { field += char; }
    }
    fields.push(cleanField(field)); return fields;
}

function cleanField(str) {
    let t = str.trim();
    if ((t.startsWith('"') && t.endsWith('"')) || (t.startsWith('„') && t.endsWith('“'))) { t = t.substring(1, t.length - 1); }
    return t.trim();
}

function importCSV(file) {
    if(!file) return;
    const targetBox = confirm("Vokabeln direkt in Box 5 (bekannt) einsortieren?\n'Abbrechen' für Box 1 (neu lernen).") ? 'box5' : 'box1';
    let detectedLevel = "Import";
    let match = file.name.toLowerCase().match(/hsk\s*([1-6])/);
    if (match) detectedLevel = "HSK " + match[1];
    
    const reader = new FileReader();
    reader.onload = (e) => {
        const rows = e.target.result.replace(/\r/g, "").split('\n');
        rows.forEach(r => {
            if(!r.trim()) return;
            const p = parseCSVLine(r);
            if(p.length >= 3) {
                state[targetBox].push({ hz: p[0], py: p[1], de: p[2], sentenceHz: p[3] || '', sentencePy: p[4] || '', sentenceDe: p[5] || '', level: p[6] ? p[6].trim() : detectedLevel, inFocus: false });
            }
        });
        updateUI(); next();
    };
    reader.readAsText(file);
}

function next() {
    if (dictMode) return; 

    let pool = [];
    const boxWeights = [0, 16, 8, 4, 2, 1]; 
    
    for(let i=1; i<=5; i++) {
        for(let j=0; j<boxWeights[i]; j++) {
            state['box'+i].forEach(c => {
                if (box5Mode && i !== 5) return;
                if (onlyFocusMode && !c.inFocus) return; 
                pool.push({c, box: 'box'+i});
                if (c.inFocus) {
                    let additionalTickets = box5Mode ? 2 : 7;
                    for (let f = 0; f < additionalTickets; f++) pool.push({c, box: 'box'+i});
                }
            });
        }
    }
    
    if(pool.length === 0) {
        currentBoxName = ""; currentCard = null;
        document.getElementById('v-box').innerText = "STATUS";
        document.getElementById('v-de').innerText = onlyFocusMode ? "Keine Fokus-Karten!" : (box5Mode ? "Box 5 leer!" : "Bitte CSV laden...");
        
        document.getElementById('writer-container').classList.add('hidden');
        document.getElementById('drawing-controls').classList.add('hidden');
        document.getElementById('learning-tools').classList.add('hidden');
        document.getElementById('special-actions').classList.add('hidden');
        document.getElementById('controls').classList.add('hidden');
        return;
    }
    
    let selection = pool[Math.floor(Math.random() * pool.length)];
    currentCard = selection.c; currentBoxName = selection.box; 
    
    document.getElementById('v-box').innerText = (currentCard.level || "Unbekannt") + (currentCard.inFocus ? " [FOKUS]" : "");
    document.getElementById('v-de').innerText = currentCard.de;
    
    highlightActiveBox();
    
    // UI Reset für Zeichenmodus
    document.getElementById('writer-container').classList.remove('hidden');
    document.getElementById('writer-container').innerHTML = '';
    
    currentWriter = null; singleCharBox = null; currentQuizChars = [];
    document.getElementById('v-hz').classList.add('hidden');
    document.getElementById('v-hz').classList.remove('long-char');
    document.getElementById('v-py').classList.add('hidden');
    
    // Actions steuern
    document.getElementById('drawing-controls').classList.remove('hidden');
    document.getElementById('learning-tools').classList.add('hidden');
    document.getElementById('special-actions').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    closeModal();

    let cleanHz = currentCard.hz.replace(/\s/g, '');
    currentQuizChars = cleanHz.split('').filter(char => /[\u4e00-\u9fa5]/.test(char));
    currentQuizCharIndex = 0;

    if (currentQuizChars.length > 0) {
        singleCharBox = document.createElement('div'); 
        singleCharBox.className = 'char-box';
        document.getElementById('writer-container').appendChild(singleCharBox);
        startQuizForCurrentChar();
    }
}

function flip() {
    if (!currentCard) return;
    document.getElementById('v-box').innerText = (currentCard.level || "Unbekannt") + (currentCard.inFocus ? " [FOKUS]" : "");

    let hzElement = document.getElementById('v-hz');
    let cleanHz = currentCard.hz.replace(/\s/g, '');
    
    hzElement.classList.toggle('long-char', cleanHz.length > 3);
    hzElement.innerText = currentCard.hz;
    document.getElementById('v-py').innerText = currentCard.py;
    
    hzElement.classList.remove('hidden');
    document.getElementById('v-py').classList.remove('hidden');
    
    let btnExample = document.getElementById('btn-example-trigger');
    if (currentCard.sentenceHz) {
        document.getElementById('ex-hz').innerText = currentCard.sentenceHz;
        document.getElementById('ex-py').innerText = currentCard.sentencePy;
        document.getElementById('ex-de').innerText = currentCard.sentenceDe;
        btnExample.disabled = false;
    } else {
        btnExample.disabled = true;
    }
    
    let btnFocus = document.getElementById('btn-focus');
    if (currentCard.inFocus) {
        btnFocus.innerText = "🎯 Fokus aktiv";
        btnFocus.style.background = "var(--focus-color)";
        btnFocus.style.color = "white";
    } else {
        btnFocus.innerText = "🎯 Fokus setzen";
        btnFocus.style.background = "var(--bg)";
        btnFocus.style.color = "var(--focus-color)";
    }
    
    document.getElementById('writer-container').classList.add('hidden');
    document.getElementById('drawing-controls').classList.add('hidden');
    
    document.getElementById('learning-tools').classList.remove('hidden');
    document.getElementById('special-actions').classList.remove('hidden');
    document.getElementById('controls').classList.remove('hidden');
}

function retryCurrentWordWriting() {
    if (!currentCard) return;
    
    document.getElementById('v-hz').classList.add('hidden');
    document.getElementById('v-py').classList.add('hidden');
    
    document.getElementById('learning-tools').classList.add('hidden');
    document.getElementById('special-actions').classList.add('hidden');
    document.getElementById('controls').classList.add('hidden');
    
    document.getElementById('drawing-controls').classList.remove('hidden');
    
    const container = document.getElementById('writer-container');
    container.innerHTML = '';
    container.classList.remove('hidden');
    
    currentWriter = null; singleCharBox = null; currentQuizChars = [];
    
    let cleanHz = currentCard.hz.replace(/\s/g, '');
    currentQuizChars = cleanHz.split('').filter(char => /[\u4e00-\u9fa5]/.test(char));
    currentQuizCharIndex = 0;

    if (currentQuizChars.length > 0) {
        singleCharBox = document.createElement('div'); 
        singleCharBox.className = 'char-box';
        container.appendChild(singleCharBox);
        startQuizForCurrentChar();
    }
}

function openModal() { document.getElementById('exampleModal').classList.remove('hidden'); }
function closeModal() { document.getElementById('exampleModal').classList.add('hidden'); }

function toggleFocus() {
    if (!currentCard) return;
    if (!currentCard.inFocus && getFocusCount() >= 150) { alert("Maximal 150 Vokabeln im Fokus!"); return; }
    
    currentCard.inFocus = !currentCard.inFocus;
    if (currentCard.inFocus) currentCard.correctCount = 0;
    
    let btnFocus = document.getElementById('btn-focus');
    if (currentCard.inFocus) {
        btnFocus.innerText = "🎯 Fokus aktiv";
        btnFocus.style.background = "var(--focus-color)";
        btnFocus.style.color = "white";
    } else {
        btnFocus.innerText = "🎯 Fokus setzen";
        btnFocus.style.background = "var(--bg)";
        btnFocus.style.color = "var(--focus-color)";
    }
    
    document.getElementById('v-box').innerText = (currentCard.level || "Unbekannt") + (currentCard.inFocus ? " [FOKUS]" : "");
    updateUI();
}

function move(step) {
    if (!currentCard) return;
    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    let level = parseInt(oldBox.replace('box',''));
    state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    
    let today = new Date().toDateString(); let effectiveStep = step;
    if (currentCard.lastMovedDate === today) { effectiveStep = 0; } 
    else if (step !== 0) { currentCard.lastMovedDate = today; }

    if (effectiveStep === 1 && currentCard.inFocus) {
        if (!currentCard.correctCount) currentCard.correctCount = 0;
        currentCard.correctCount++;
        if (currentCard.correctCount >= 20) { currentCard.inFocus = false; currentCard.correctCount = 0; }
    }

    let newLevel = Math.min(Math.max(level + effectiveStep, 1), 5);
    state['box' + newLevel].push(currentCard);
    updateUI(); next();
}

function moveToBox5() {
    if (!currentCard) return;
    let oldBox = Object.keys(state).find(k => state[k].includes(currentCard));
    if (oldBox) state[oldBox] = state[oldBox].filter(c => c !== currentCard);
    currentCard.lastMovedDate = new Date().toDateString();
    state['box5'].push(currentCard);
    updateUI(); next();
}

function resetSpeicher() { if(confirm("Lernstand wirklich löschen?")) { state = { box1: [], box2: [], box3: [], box4: [], box5: [] }; updateUI(); location.reload(); } }
function exportProgress() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); const dl = document.createElement('a'); dl.setAttribute("href", dataStr); dl.setAttribute("download", "hsk_backup.json"); dl.click(); }
function importProgress(file) { const reader = new FileReader(); reader.onload = (e) => { state = JSON.parse(e.target.result); updateUI(); next(); }; reader.readAsText(file); }
function clearCanvas() { if (currentWriter) currentWriter.cancelQuiz(); currentQuizCharIndex = 0; startQuizForCurrentChar(); }
function speak() { if(!currentCard) return; const u = new SpeechSynthesisUtterance(currentCard.hz); u.lang = 'zh-CN'; window.speechSynthesis.speak(u); }

updateUI(); next();
</script>
